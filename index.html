  const chips=[['all','전체'],['fav','★ 즐겨찾기'],...((ja?S.custom.ja:S.custom.en).length?[['mine','내 단어']]:[]),...Object.entries(cats).filter(([k])=>k!=='mine').map(([k,[l]])=>[k,l])];
  vb.innerHTML=`<div class="chart">
    <input type="search" class="wl-search" id="wlq" placeholder="${ja?'단어, 읽기, 로마자, 뜻으로 검색':'단어나 뜻으로 검색'}" value="${esc(ls.q)}" aria-label="단어 검색" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="chips" id="wlc">${chips.map(([k,l])=>`<button class="chip" data-wc="${k}" aria-pressed="${ls.cat===k}">${l}</button>`).join('')}</div>
    <div>
      <button class="btn" data-addtoggle style="width:100%">${ls.add?'닫기':'+ 내 단어 추가'}</button>
      ${ls.add?`<form class="add-form" id="addForm" style="margin-top:8px" autocomplete="off">
        ${ja?`<input id="aw" type="text" lang="ja" placeholder="단어 (예: 猫, ねこ)" aria-label="단어"><input id="ar" type="text" lang="ja" placeholder="읽기 – 히라가나 (예: ねこ)" aria-label="읽기"><input id="am" type="text" lang="ko" placeholder="뜻 – 여러 개면 쉼표로 (예: 고양이)" aria-label="뜻">`
          :`<input id="aw" type="text" lang="en" inputmode="email" placeholder="영어 단어나 표현" aria-label="단어"><input id="am" type="text" lang="ko" placeholder="뜻 – 여러 개면 쉼표로" aria-label="뜻">`}
        <button class="btn primary" type="submit">추가하기</button>${ls.msg?`<p class="note" style="color:var(--ink)">${esc(ls.msg)}</p>`:''}</form>`:''}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><p class="note" id="wlcount"></p>${LEGEND}</div>
    <div class="wl" id="wl"></div>
  </div>`;
  const draw=()=>{
    const all=ja?WORDS:EN_WORDS;const qq=ls.q.trim().toLowerCase();
    let list=all.filter(w=>ls.cat==='all'||(ls.cat==='fav'?S.fav[w.key]:w.cats.includes(ls.cat)));
    if(qq)list=list.filter(w=>w.w.toLowerCase().includes(qq)||w.m.some(m=>m.includes(qq))||(ja&&(w.r.includes(qq)||toHira(w.r).includes(toHira(qq))||romaji(w.r).includes(qq))));
    document.getElementById('wlcount').textContent=`${list.length}개${list.length>300?' · 처음 300개만 보여요. 검색이나 분류로 좁혀 보세요.':''}`;
    document.getElementById('wl').innerHTML=list.slice(0,300).map(w=>`<div class="wl-i" data-key="${esc(w.key)}" data-st="${status(w.key)}">
      <button class="wl-main" data-open><span class="w ${ja?'jp':'en'}" lang="${lang}">${esc(w.w)}</span>${ja&&w.w!==w.r?`<span class="s jp" lang="ja">${esc(w.r)}</span>`:''}<span class="s">${esc(w.m.join(', '))}</span></button>
      <button class="star" data-star aria-pressed="${!!S.fav[w.key]}" aria-label="즐겨찾기">${S.fav[w.key]?'★':'☆'}</button>
      <div class="wl-ex" hidden>${ja?`<span class="mono s">${romaji(w.r)}</span>`:''}${w.ex?(ja?`<span class="ex-jp" lang="ja" style="font-size:16px">${markWord(w.ex,[w.w,w.r])}</span><span class="ex-rd" lang="ja">${esc(w.exr)}</span><span class="ex-ko">${esc(w.exko)}</span>`:`<span class="ex-en" lang="en" style="font-size:16px">${markWord(w.ex,[w.w,...w.alt],true)}</span><span class="ex-ko">${esc(w.exko)}</span>`):''}
        <div class="row" style="margin-top:4px">${w.ex?spkBtn(w.ex,'예문 듣기',lang):''}${w.mine?`<button class="spk" data-del>삭제</button>`:''}</div></div></div>`).join('');
  };
  draw();
  document.getElementById('wlq').addEventListener('input',e=>{ls.q=e.target.value;draw()});
  const form=document.getElementById('addForm');
  if(form)form.addEventListener('submit',e=>{e.preventDefault();
    const w=document.getElementById('aw').value.trim(),m=document.getElementById('am').value.trim().split(/[,，/]/).map(x=>x.trim()).filter(Boolean).join('/');
    if(ja){const r=toHira(document.getElementById('ar').value.trim().replace(/\s/g,''));const ww=w||r;
      if(!ww||!r||!m){ls.msg='단어, 읽기, 뜻을 모두 입력해 주세요.';return renderWordList(lang)}
      if(!/^[ぁ-ゖー]+$/.test(r)){ls.msg='읽기는 히라가나로 입력해 주세요.';return renderWordList(lang)}
      if(WORDS.some(x=>x.w===ww&&x.r===r)){ls.msg='이미 있는 단어예요.';return renderWordList(lang)}
      S.custom.ja.push({w:ww,r,m});
    }else{
      if(!w||!m){ls.msg='단어와 뜻을 모두 입력해 주세요.';return renderWordList(lang)}
      if(EN_WORDS.some(x=>x.w.toLowerCase()===w.toLowerCase())){ls.msg='이미 있는 단어예요.';return renderWordList(lang)}
      S.custom.en.push({w,m});
    }
    rebuildWords();if(ja){S.word.cats=[...new Set([...S.word.cats,'mine'])];R.word=null}else{S.ew.cats=[...new Set([...S.ew.cats,'mine'])];R.ew=null}
    save();ls.msg='추가했어요. 단어 퀴즈에도 나와요.';ls.cat='mine';renderWordList(lang);
  });
  vb.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.wc){ls.cat=b.dataset.wc;vb.querySelectorAll('[data-wc]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();return}
    if('addtoggle' in b.dataset){ls.add=!ls.add;ls.msg='';renderWordList(lang);return}
    const row=b.closest('.wl-i');if(!row)return;const key=row.dataset.key;
    if('star' in b.dataset){if(S.fav[key])delete S.fav[key];else S.fav[key]=1;save();const on=!!S.fav[key];b.setAttribute('aria-pressed',on);b.textContent=on?'★':'☆';return}
    if('del' in b.dataset){if(b.dataset.confirm){const arr=ja?S.custom.ja:S.custom.en;const i=arr.findIndex(c=>(ja?'w:'+c.w+'|'+c.r:'ew:'+c.w)===key);if(i>=0)arr.splice(i,1);delete S.fav[key];rebuildWords();R.word=null;R.ew=null;save();draw()}else{b.dataset.confirm='1';b.textContent='정말 삭제'}return}
    if('open' in b.dataset){const ex=row.querySelector('.wl-ex');const show=ex.hidden;vb.querySelectorAll('.wl-i.hit').forEach(x=>{x.classList.remove('hit');x.querySelector('.wl-ex').hidden=true});
      if(show){row.classList.add('hit');ex.hidden=false;const w=(ja?WORDS:EN_WORDS).find(x=>x.key===key);if(w)speak(ja?w.r:w.w,lang)}}
  };
}

/* stats */
let CAL=null;
function renderStats(){
  const vb=document.getElementById('vbody');
  const now=new Date();if(!CAL)CAL={y:now.getFullYear(),m:now.getMonth()};
  const days=Object.entries(S.days);const tn=totalN(),tc=days.reduce((a,[,d])=>a+d.c,0);
  const studied=days.filter(([,d])=>d.n>0).length;
  const first=new Date(CAL.y,CAL.m,1),dim=new Date(CAL.y,CAL.m+1,0).getDate();
  const lvl=n=>!n?0:n<10?1:n<30?2:3;
  let cells='일월화수목금토'.split('').map(d=>`<span class="dow">${d}</span>`).join('');
  for(let i=0;i<first.getDay();i++)cells+='<span class="d out"></span>';
  for(let d=1;d<=dim;d++){const k=dayKey(new Date(CAL.y,CAL.m,d));const n=S.days[k]?.n||0;cells+=`<span class="d${S.goalDays[k]?' goal':''}${k===today()?' today':''}" data-l="${lvl(n)}" title="${n}문제">${d}</span>`}
  const week=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d);week.push({lbl:'일월화수목금토'[d.getDay()],n:S.days[k]?.n||0,c:S.days[k]?.c||0,today:i===0})}
  const mx=Math.max(10,...week.map(w=>w.n));const W=320,H=150,top=22,bot=24,bw=28,gap=(W-7*bw)/8;
  const bars=week.map((w,i)=>{const x=gap+i*(bw+gap);const h=Math.round((H-top-bot)*w.n/mx);const y=H-bot-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,w.n?2:0)}" rx="4" fill="${w.today?'var(--shu)':'var(--ai)'}"/>${w.n?`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="var(--ink)" style="font-variant-numeric:tabular-nums">${w.n}</text>`:''}<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="var(--muted)">${w.lbl}</text>`}).join('');
  const wn=week.reduce((a,w)=>a+w.n,0),wc=week.reduce((a,w)=>a+w.c,0);
  const rows=(S.lang==='ja'?[['문자',kanaKeys()],['단어',WORDS.map(w=>w.key)],['외래어',LOANS.map(x=>x.key)],['동사 활용',CONJ_ITEMS.map(x=>x.key)],['문장 고르기',SENTS.map(s=>s.key)],['문장 조립',ITEMS.jb.map(s=>s.key)],['문장 듣기',ITEMS.jl.map(s=>s.key)],['받아쓰기',ITEMS.jd.map(s=>s.key)]]
    :[['단어',EN_WORDS.map(w=>w.key)],['문장 고르기',EN_SENTS.map(s=>s.key)],['문장 조립',ITEMS.eb.map(s=>s.key)],['문장 듣기',ITEMS.el.map(s=>s.key)],['받아쓰기',ITEMS.ed.map(s=>s.key)]]);
  vb.innerHTML=`<div class="chart">
    <div class="kpis" style="margin-top:0">
      <div class="kpi"><b class="num">${tn.toLocaleString()}</b><span>누적 문제</span></div>
      <div class="kpi"><b class="num">${tn?Math.round(tc/tn*100)+'%':'–'}</b><span>전체 정답률</span></div>
      <div class="kpi"><b class="num">${longestStreak()}일</b><span>최장 연속</span></div>
    </div>
    <p class="note">공부한 날 ${studied}일 · 목표 달성 ${Object.keys(S.goalDays).length}일</p>
    <section class="chart-box"><div class="cal-head"><button class="btn quiet" data-cal="-1" aria-label="이전 달">‹</button><b>${CAL.y}년 ${CAL.m+1}월</b><button class="btn quiet" data-cal="1" aria-label="다음 달">›</button></div><div class="cal">${cells}</div>
      <p class="note" style="margin-top:8px">색이 진할수록 많이 푼 날이에요. 빨간 동그라미는 하루 목표를 채운 날이에요.</p></section>
    <section class="chart-box"><h2 class="sec-title" style="margin-bottom:4px">최근 7일</h2><p class="note">${wn}문제 · 정답률 ${wn?Math.round(wc/wn*100)+'%':'–'}</p><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 푼 문제 수"><line x1="0" y1="${H-bot}" x2="${W}" y2="${H-bot}" stroke="var(--line)"/>${bars}</svg></section>
    <section class="chart-box"><h2 class="sec-title">${S.lang==='ja'?'일본어':'영어'} 익힌 정도</h2><div class="mst">${rows.map(([l,ks])=>{const d=doneCount(ks);return `<div class="mst-row"><div><b style="font-weight:500">${l}</b><span>${d} / ${ks.length}</span></div><div class="meter"><i style="width:${ks.length?d/ks.length*100:0}%"></i></div></div>`}).join('')}</div>
      <p class="note" style="margin-top:8px">두 번 연속으로 맞히면 '익힘'으로 셉니다.</p></section>
  </div>`;
  vb.onclick=e=>{const b=e.target.closest('[data-cal]');if(!b)return;CAL.m+=+b.dataset.cal;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}renderStats()};
}
function renderBadges(){
  const vb=document.getElementById('vbody');checkBadges();
  const got=BADGES.filter(b=>S.badges.includes(b.id)).length;
  vb.innerHTML=`<div class="chart"><p class="note">${BADGES.length}개 중 ${got}개 획득</p><div class="badges">${BADGES.map(b=>{const has=S.badges.includes(b.id);const [c,m]=b.p();
    return `<div class="bdg" data-got="${has}"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M21 3.5c9.5 0 16 7 15.5 16.5-.5 9-7.5 16-16.5 15.5C11 35 4 28 4.5 19 5 10 12 3.8 22 4.5"/><path d="M21 12c4.5.3 7.5 3.8 7.2 8-.4 4.2-3.9 7.3-8.1 7-4-.4-6.8-3.8-6.4-7.7.4-3.4 3.2-5.5 6.3-5.2 2.9.3 4.6 2.5 4.4 5.2-.2 2.1-2 3.6-4 3.4"/></svg>
      <b>${b.name}</b><small>${b.desc}</small>${has?'<small style="color:var(--ok);font-weight:600">획득</small>':`<div class="meter"><i style="width:${Math.min(100,c/m*100)}%"></i></div><small class="num">${c} / ${m}</small>`}</div>`}).join('')}</div></div>`;
}

/* keyboard (desktop) */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(curTab()==='home')return;
  const mod=activeMod();
  if(SPEED.has(mod)){if(SP&&SP.running&&/^[1-4]$/.test(e.key)){answerSpeed(+e.key-1);e.preventDefault()}return}
  const r=R[mod];if(!r||r.done||r.empty)return;
  if(e.target.matches('input,textarea'))return;
  const choiceWord=(mod==='word'||mod==='ew')&&S.set.wans==='choice';
  const optAttr=['sent','jl','es','el','kconf'].includes(mod)?'opt':(choiceWord||mod==='loan'||mod==='conj')?'wopt':null;
  if(optAttr){
    if(!r.answered&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`[data-${optAttr}="${+e.key-1}"]`);if(b)b.click();e.preventDefault()}
    else if(r.answered&&e.key==='Enter'){next(mod);e.preventDefault()}
    return;
  }
  if(BUILD.has(mod)){if(e.key==='Enter'){r.answered?next(mod):checkBuild(mod,false);e.preventDefault()}return}
  if((mod==='kana'&&S.kana.dir==='r2k'||mod==='jd')&&S.kana.input==='pad'){
    if(e.key==='Enter'){if(r.answered)next(mod);else if(padVal)CHECK[mod](padVal);e.preventDefault()}
    else if(e.key==='Backspace'&&!r.answered){padVal=padVal.slice(0,-1);renderPad('');e.preventDefault()}
    return;
  }
  if(r.answered&&e.key==='Enter'){next(mod);e.preventDefault()}
});

applyLook();
renderTabs();
go(curTab());
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
