<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하나마루 일본어</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하나마루">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one-column study app — sticky header, a 田字格 practice card as the focal object, answer zone under it, fixed bottom tab bar. Red 〇 = teacher's grading mark. */
:root{
  --paper:#EDEFE9; --surface:#FAFBF7; --sunk:#E3E6DE; --ink:#19202C; --muted:#5B6371; --line:#CDD2C7;
  --ai:#2A4A7C; --ai-soft:#DCE3EE; --on-ai:#FFFFFF;
  --shu:#C9372C; --ok:#2C7A4D; --ok-soft:#DCEDE2; --ng:#B2352B; --ng-soft:#F4DDD9; --warn:#A86A12;
  --f-jp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151C;--surface:#1A202B;--sunk:#151A23;--ink:#E6E8EC;--muted:#9AA2B0;--line:#2D3543;
  --ai:#93B2E4;--ai-soft:#22304A;--on-ai:#0E1420;--shu:#EA5B4E;--ok:#6CC18F;--ok-soft:#1B3226;--ng:#EF7C70;--ng-soft:#3B2225;--warn:#E0A94A;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151C;--surface:#1A202B;--sunk:#151A23;--ink:#E6E8EC;--muted:#9AA2B0;--line:#2D3543;
  --ai:#93B2E4;--ai-soft:#22304A;--on-ai:#0E1420;--shu:#EA5B4E;--ok:#6CC18F;--ok-soft:#1B3226;--ng:#EF7C70;--ng-soft:#3B2225;--warn:#E0A94A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--f-jp)}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:24px;height:24px;flex:none}
.top-meta{font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .2s}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ai);font-weight:600}
body.typing .tabs{transform:translateY(110%)}

/* generic controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);min-height:36px}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ink);font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--ng-soft);border-color:var(--ng)}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ai)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* setup bar */
.setup{margin-bottom:10px}
.setup-sum{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;text-align:left;min-height:44px}
.setup-sum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-sum svg{width:16px;height:16px;flex:none;transition:transform .2s;color:var(--muted)}
.setup[data-open="true"] .setup-sum svg{transform:rotate(180deg)}
.setup-body{display:grid;gap:14px;padding:14px 4px 4px}
.setup-row{display:grid;gap:6px}
.setup-row>label,.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.note{font-size:13px;color:var(--muted);margin:0}

/* progress */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:2px 0 10px}
.prog-bar{flex:1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ai);width:0;transition:width .3s}
.score{display:flex;gap:8px}
.score .o{color:var(--shu)}

/* the practice card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.tz{position:relative;width:150px;height:150px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:4px}
.tz::before,.tz::after{content:"";position:absolute;pointer-events:none}
.tz::before{left:50%;top:6px;bottom:6px;border-left:1px dashed var(--line)}
.tz::after{top:50%;left:6px;right:6px;border-top:1px dashed var(--line)}
.tz.wide{width:100%;height:auto;min-height:120px;border:0}
.tz.wide::before{display:none}
.glyph{font-family:var(--f-jp);font-size:108px;line-height:1;font-weight:500;position:relative;z-index:1}
.glyph.two{font-size:66px;letter-spacing:-.04em}
.roma{font-family:var(--f-mono);font-size:50px;line-height:1;position:relative;z-index:1}
.word{font-family:var(--f-jp);font-weight:500;line-height:1.15;text-align:center;position:relative;z-index:1;padding-block:8px}
.cap{margin:0;font-size:13px;color:var(--muted)}
.cat{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.qbtn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:17px;color:var(--ai);z-index:3}
.qbtn[aria-expanded="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.reading{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;font-size:16px;text-align:center}
.reading .jp{font-size:20px}
.reading .mono{color:var(--muted);font-size:15px}
.ko{font-size:22px;font-weight:600;line-height:1.45;text-align:center;margin:18px 4px 6px;text-wrap:balance}
.mark{position:absolute;inset:0;margin:auto;width:210px;height:210px;pointer-events:none;z-index:2;display:none}
.mark path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.card[data-mark="ok"] .mark.o,.card[data-mark="ng"] .mark.x{display:block}
.card[data-mark="ok"] .mark.o path{stroke:var(--shu);stroke-width:7;animation:draw .45s ease-out forwards}
.card[data-mark="ng"] .mark.x path{stroke:var(--ng);stroke-width:6;opacity:.75;animation:draw .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* answer zone */
.zone{margin-top:12px}
.ans-form{display:flex;gap:8px}
.ans-form input{flex:1;min-width:0;font-size:19px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:50px}
.ans-form input.roman{font-family:var(--f-mono)}
.ans-form input.ja{font-family:var(--f-jp)}
.ans-form input:focus{border-color:var(--ai);outline:none}
.ans-form input[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.ans-form input[data-state="ng"]{border-color:var(--ng);background:var(--ng-soft)}
.sub-actions{display:flex;justify-content:flex-end;margin-top:4px}

/* keypad */
.pad{display:grid;gap:6px}
.pad-out{min-height:54px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--f-jp);font-size:32px;margin-bottom:4px}
.pad-out[data-state="ok"]{border-color:var(--ok);color:var(--ok)}
.pad-out[data-state="ng"]{border-color:var(--ng);color:var(--ng)}
#padTxt:empty::before{content:"아래에서 골라 입력";font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.caret{width:2px;height:30px;background:var(--ai);animation:blink 1s steps(1) infinite}
.pad-out[data-state] .caret{display:none}
@keyframes blink{50%{opacity:0}}
.pad-grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,42px);grid-auto-flow:column;gap:4px}
.k,.pad-fn button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-jp);font-size:19px;padding:0;min-width:0}
.k:active,.pad-fn button:active{background:var(--ai-soft)}
.k.blank{border:0;background:transparent}
.pad-fn{display:grid;grid-template-columns:repeat(6,1fr) 1.8fr;gap:4px}
.pad-fn button{height:46px}
.pad-fn .fn{font-family:var(--f-ui);font-size:15px;color:var(--muted);background:var(--sunk)}
.pad-fn .pad-ok{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-family:var(--f-ui);font-weight:600;font-size:15px}

/* sentence options */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:3px;min-height:56px;position:relative}
.opt .n{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opt .jp{font-size:20px;line-height:1.45;padding-right:20px}
.opt .rd{font-family:var(--f-jp);font-size:14px;color:var(--muted)}
.opt .tr{font-size:14px;color:var(--muted)}
.opt[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-state="ng"]{border-color:var(--ng);background:var(--ng-soft)}
.opt[data-state="dim"]{opacity:.7}

/* feedback */
.fb{margin-top:12px;display:grid;gap:10px}
.fb:empty{display:none}
.fb-box{border-radius:14px;padding:12px 14px;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line)}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--f-jp);font-size:15px;flex:none}
.fb-box.ok .badge{border:2px solid var(--shu);color:var(--shu)}
.fb-box.ng .badge{background:var(--ng-soft);color:var(--ng)}
.fb-box.ok .fb-head{color:var(--ok)}
.fb-box.ng .fb-head{color:var(--ng)}
.fb-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fb-line .jp{font-size:22px}
.fb-big{font-family:var(--f-jp);font-size:21px;line-height:1.5;margin:0}
.fb-sub{font-size:14px;color:var(--muted);margin:0}
.fb-actions{display:flex;gap:8px;flex-wrap:wrap}
.fb-actions .btn{flex:1}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;color:var(--ai);font-weight:600;min-height:34px}
.spk svg{width:18px;height:18px}
.given s{color:var(--ng)}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:grid;gap:14px}
.sum-score{position:relative;display:flex;align-items:baseline;justify-content:center;gap:6px;padding:20px 0}
.sum-score b{font-size:64px;line-height:1;font-weight:700}
.sum-score span{font-size:22px;color:var(--muted)}
.sum-score svg{position:absolute;inset:0;margin:auto;width:150px;height:150px}
.sum-score svg path{fill:none;stroke:var(--shu);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out .1s forwards}
.sum-msg{text-align:center;margin:0;color:var(--muted)}
.miss{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.miss li{display:flex;align-items:baseline;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.miss .jp{font-size:20px}
.miss .s{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;display:grid;gap:12px;justify-items:center}

/* home */
.home{display:grid;gap:22px}
.h1{font-size:24px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.date{color:var(--muted);font-size:14px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.mods{display:grid;gap:10px}
.modc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.modc-head{display:flex;align-items:center;gap:12px}
.modc-ico{width:44px;height:44px;border-radius:12px;background:var(--ai-soft);display:grid;place-items:center;font-family:var(--f-jp);font-size:22px;color:var(--ai);flex:none}
.modc h3{margin:0;font-size:17px}
.modc p{margin:0;font-size:13px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak span{font-family:var(--f-jp);font-size:18px;min-width:38px;height:38px;padding:0 8px;display:grid;place-items:center;border-radius:8px;background:var(--ng-soft);color:var(--ng)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row div{min-width:0}
.set-row b{display:block;font-weight:500;font-size:15px}
.set-row small{display:block;color:var(--muted);font-size:12px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.danger{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* chart */
.chart{display:grid;gap:18px}
.gojuon{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gojuon.y{grid-template-columns:repeat(3,1fr)}
.cell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:grid;justify-items:center;gap:0;min-height:62px}
.cell .jp{font-size:26px;line-height:1.2}
.cell .mono{font-size:11px;color:var(--muted)}
.cell.blank{visibility:hidden}
.cell::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:transparent}
.cell[data-st="weak"]::after{background:var(--ng)}
.cell[data-st="learn"]::after{background:var(--warn)}
.cell[data-st="done"]::after{background:var(--ok)}
.cell.hit{background:var(--ai-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* english */
.en{font-family:var(--f-en)}
.lang button{padding:6px 11px;font-size:13px;min-height:32px}
.modc-ico svg{width:24px;height:24px}
.eword{position:relative;z-index:1;font-family:var(--f-en);font-weight:500;line-height:1.1;text-align:center;padding:6px 10px 12px;overflow-wrap:anywhere}
.eword::after{content:"";position:absolute;left:0;right:0;bottom:4px;border-top:2px solid var(--shu);opacity:.4}
.pat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:2px 0}
.pw{display:flex;gap:4px}
.pw i{width:16px;height:28px;border-bottom:2px solid var(--muted);font-style:normal;font-family:var(--f-mono);font-size:18px;line-height:26px;text-align:center;color:var(--ai)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 4px}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--ai);color:var(--on-ai);display:grid;place-items:center}
.play svg{width:34px;height:34px;margin-left:4px}
.ko.en{font-family:var(--f-en);font-weight:500}
.fb-big.en{font-family:var(--f-en);font-weight:500}
.opt .en{font-size:18px;line-height:1.4;padding-right:20px}
.opt .ko-opt{font-size:17px;font-weight:500;padding-right:20px}
.opt .tr.en{font-family:var(--f-en);font-size:15px}

/* v3 additions */
.modes{display:flex;width:100%;margin-bottom:10px}
.modes button{flex:1}
.goal{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.goal svg{width:58px;height:58px;flex:none;transform:rotate(-90deg)}
.goal circle{fill:none;stroke-width:6}
.goal .bg{stroke:var(--sunk)}
.goal .fg{stroke:var(--ai);stroke-linecap:round;transition:stroke-dashoffset .5s}
.goal[data-done="true"] .fg{stroke:var(--shu)}
.goal div{display:grid;gap:1px}
.goal b{font-size:20px;font-weight:700}
.goal small{font-size:13px;color:var(--muted)}
.ex{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:2px}
.ex p{margin:0}
.ex-jp{font-family:var(--f-jp);font-size:18px;line-height:1.5}
.ex-en{font-family:var(--f-en);font-size:18px;line-height:1.45}
.ex-rd{font-family:var(--f-jp);font-size:14px;color:var(--muted)}
.ex-ro{font-size:12px;color:var(--muted)}
.ex-ko{font-size:14px;color:var(--muted)}
.ex mark{background:var(--ai-soft);color:inherit;border-radius:3px;padding:0 2px}
.ex .spk{justify-self:start;margin-top:4px}
.build-line{min-height:62px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding:8px 0;margin-bottom:12px}
.build-line[data-state="ok"]{border-color:var(--ok)}
.build-line[data-state="ng"]{border-color:var(--ng)}
.build-line:empty::before{content:"아래 블록을 순서대로 눌러 보세요";color:var(--muted);font-size:14px;padding-bottom:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.blk{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:18px;min-height:44px;line-height:1.3}
.blk.jp{font-family:var(--f-jp)}
.blk.en{font-family:var(--f-en)}
.blk.used{visibility:hidden}
.build-line .blk{background:var(--ai-soft);border-color:var(--ai)}
.backup textarea{width:100%;min-height:96px;font-family:var(--f-mono);font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);word-break:break-all;resize:vertical}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:40;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.opt .ko-opt+.tr{font-size:15px}

/* v4 additions */
:root{--heat1:#D6DFEC;--heat2:#9FB4D6;--heat3:#2A4A7C;--zoom:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--heat1:#22304A;--heat2:#3A5584;--heat3:#93B2E4}}
:root[data-theme="dark"]{--heat1:#22304A;--heat2:#3A5584;--heat3:#93B2E4}
.shell{zoom:var(--zoom)}
.modes{flex-wrap:nowrap;overflow-x:auto}
.modes button{flex:1;padding:7px 6px;font-size:13px;white-space:nowrap}
.conf{display:flex;gap:8px;flex-wrap:wrap}
.conf span{display:grid;justify-items:center;padding:6px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.conf b{font-family:var(--f-jp);font-size:30px;font-weight:500;line-height:1.2}
.conf small{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt .glyph-opt{font-family:var(--f-jp);font-size:34px;line-height:1.2;text-align:center}
.opt .mono-opt{font-family:var(--f-mono);font-size:20px}
.opts.grid2 .opt{justify-items:center;text-align:center}
.form-tbl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;align-items:baseline}
.form-tbl .jp{font-size:17px}
.form-tbl .cur{color:var(--ai);font-weight:600}
.diff .bad{color:var(--ng);text-decoration:underline wavy;text-underline-offset:4px}
.diff .miss{background:var(--ng-soft);border-radius:3px;padding:0 1px}
.fb-more{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:6px 2px;min-height:34px}
.big-word{font-family:var(--f-jp);font-weight:500;line-height:1.2;text-align:center;position:relative;z-index:1}
.target{font-size:15px;font-weight:600;color:var(--ai);background:var(--ai-soft);border-radius:999px;padding:5px 14px}
.speed-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.speed-bar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.speed-bar i{display:block;height:100%;background:var(--shu);width:100%}
.speed-top b{font-size:22px;min-width:2ch;text-align:right}
.speed-top span{font-size:13px;color:var(--muted);min-width:3ch}
.big-num{font-size:64px;font-weight:700;line-height:1}
.wl{display:grid;border-top:1px solid var(--line)}
.wl-i{display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid var(--line)}
.wl-main{display:flex;align-items:baseline;gap:2px 12px;flex-wrap:wrap;text-align:left;border:0;background:transparent;padding:11px 22px 11px 4px;position:relative;min-width:0}
.wl-main::after{content:"";position:absolute;right:6px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:transparent}
.wl-i[data-st="weak"] .wl-main::after{background:var(--ng)}
.wl-i[data-st="learn"] .wl-main::after{background:var(--warn)}
.wl-i[data-st="done"] .wl-main::after{background:var(--ok)}
.wl-main .w{font-size:19px;font-weight:600}
.wl-main .s{font-size:14px;color:var(--muted)}
.star{border:0;background:transparent;font-size:20px;width:44px;height:44px;color:var(--muted)}
.star[aria-pressed="true"]{color:var(--warn)}
.wl-i.hit{background:var(--ai-soft)}
.wl-ex{grid-column:1/-1;display:grid;gap:2px;padding:0 6px 12px}
.wl-search{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.add-form{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.add-form input{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:12px;color:var(--muted)}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:8px;display:grid;place-items:center;font-size:13px;position:relative;background:var(--sunk);font-variant-numeric:tabular-nums}
.cal .d[data-l="1"]{background:var(--heat1)}
.cal .d[data-l="2"]{background:var(--heat2)}
.cal .d[data-l="3"]{background:var(--heat3);color:var(--on-ai)}
.cal .d.goal::after{content:"";position:absolute;inset:3px;border:2px solid var(--shu);border-radius:50%;opacity:.85}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .d.out{visibility:hidden}
.chart-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chart-box svg{width:100%;height:auto;display:block}
.mst{display:grid;gap:10px}
.mst-row{display:grid;gap:4px}
.mst-row div:first-child{display:flex;justify-content:space-between;font-size:14px}
.mst-row span{color:var(--muted);font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;align-content:start}
.bdg svg{width:40px;height:40px}
.bdg path{fill:none;stroke-width:3;stroke-linecap:round;stroke:var(--shu)}
.bdg[data-got="false"] path{stroke:var(--line)}
.bdg b{font-size:15px}
.bdg small{font-size:12px;color:var(--muted);line-height:1.4}
.bdg .meter{height:4px}
.due{display:grid;gap:10px}
.due-n{display:flex;align-items:baseline;gap:8px}
.due-n b{font-size:32px;font-weight:700;line-height:1}

@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}.mark path,.sum-score svg path{stroke-dashoffset:0}}
@media (max-width:360px){.glyph{font-size:92px}.tz{width:132px;height:132px}.pad-grid{grid-template-rows:repeat(5,38px)}.k{font-size:17px}}

/* ================= pure logic: conjugation, numbers, dictation ================= */
const U_ROW='うくぐすつぬぶむる';
const I_E_ROW='いきぎしじちぢにひびぴみりえけげせぜてでねへべぺめれ';
const GODAN_EX=new Set(['帰る','入る','走る','知る','切る','要る','減る','喋る','滑る','握る','蹴る','焦る','限る','参る','散る','練る','照る','茂る','遮る','しゃべる','かえる','はいる','はしる']);
const TO_I={う:'い',く:'き',ぐ:'ぎ',す:'し',つ:'ち',ぬ:'に',ぶ:'び',む:'み',る:'り'};
const TO_A={う:'わ',く:'か',ぐ:'が',す:'さ',つ:'た',ぬ:'な',ぶ:'ば',む:'ま',る:'ら'};
const TE={う:'って',つ:'って',る:'って',く:'いて',ぐ:'いで',す:'して',ぬ:'んで',ぶ:'んで',む:'んで'};
const FORMS={masu:'~ます (정중형)',te:'~て (연결형)',nai:'~ない (부정형)',ta:'~た (과거형)'};
const FORM_SHORT={masu:'ます형',te:'て형',nai:'ない형',ta:'た형'};
function verbGroup(w,r){
  if(r==='くる'&&/来る$/.test(w))return 'kuru';
  if(/する$/.test(r))return 'suru';
  const last=r.slice(-1);if(!U_ROW.includes(last))return null;
  if(last==='る'&&I_E_ROW.includes(r.slice(-2,-1))&&!GODAN_EX.has(w)&&!GODAN_EX.has(r))return 'ichi';
  return 'godan';
}
const teToTa=s=>s.replace(/て$/,'た').replace(/で$/,'だ');
function conjOne(base,group,form,isIku,isAru){
  const stem=base.slice(0,-1),last=base.slice(-1);
  if(group==='suru'){const p=base.slice(0,-2);return p+{masu:'します',te:'して',nai:'しない',ta:'した'}[form]}
  if(group==='ichi')return stem+{masu:'ます',te:'て',nai:'ない',ta:'た'}[form];
  if(form==='masu')return stem+TO_I[last]+'ます';
  if(form==='nai')return isAru?'ない':stem+TO_A[last]+'ない';
  const te=isIku?stem+'って':stem+TE[last];
  return form==='te'?te:teToTa(te);
}
function conjugate(v,form){
  const g=verbGroup(v.w,v.r);if(!g)return null;
  if(g==='kuru'){const t={masu:['来ます','きます'],te:['来て','きて'],nai:['来ない','こない'],ta:['来た','きた']}[form];const p=v.w.slice(0,-2);return {w:p+t[0],r:v.r.slice(0,-2)+t[1]}}
  const isIku=v.r==='いく'||/行く$/.test(v.w);const isAru=v.r==='ある';
  return {w:conjOne(v.w,g,form,isIku,isAru&&v.w==='ある'||isAru),r:conjOne(v.r,g,form,isIku,isAru)};
}
function conjWrongs(v,form){
  const g=verbGroup(v.w,v.r);const out=[];const right=conjugate(v,form);
  const add=(w,r)=>{if(w&&r&&r!==right.r&&!out.some(o=>o.r===r))out.push({w,r})};
  if(g==='godan'||g==='ichi'){
    const other=g==='godan'?'ichi':'godan';
    if(!(other==='godan'&&!TO_I[v.r.slice(-1)]))add(conjOne(v.w,other,form,false,false),conjOne(v.r,other,form,false,false));
    if((form==='te'||form==='ta')&&g==='godan'){for(const e of ['って','いて','んで','して']){const t=v.r.slice(0,-1)+e,tw=v.w.slice(0,-1)+e;add(form==='te'?tw:teToTa(tw),form==='te'?t:teToTa(t))}}
    if(form==='nai'&&g==='godan'){add(v.w.slice(0,-1)+TO_I[v.r.slice(-1)]+'ない',v.r.slice(0,-1)+TO_I[v.r.slice(-1)]+'ない')}
    if(form==='masu'&&g==='godan'){add(v.w.slice(0,-1)+'ます',v.r.slice(0,-1)+'ます')}
    if(form==='masu'&&g==='ichi'){add(v.w.slice(0,-1)+'ります',v.r.slice(0,-1)+'ります')}
  }
  for(const f of Object.keys(FORMS))if(f!==form){const c=conjugate(v,f);if(c)add(c.w,c.r)}
  if(g==='suru'){const p=v.w.slice(0,-2),pr=v.r.slice(0,-2);add(p+'すます',pr+'すます');add(p+'さない',pr+'さない');add(p+'すて',pr+'すて')}
  if(g==='kuru'){add('来ります','くります');add('来ない','くない');add('来って','くって')}
  return out;

function pickN(pool,n){

  while(out.length<n){const tot=arr.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,i=0;for(;i<arr.length-1;i++){r-=arr[i].w;if(r<=0)break}out.push(arr[i].p);arr.splice(i,1)}
  return out;
}

/* backup */
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b){const bin=atob(b);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes)}
function makeCode(){const st=Object.entries(S.stats).map(([k,v])=>[k,v.c,v.w,v.s,v.iv??0,v.d??0]);return 'HM2.'+b64enc(JSON.stringify({s:st,d:S.days,c:S.custom,f:Object.keys(S.fav),b:S.best,g:S.goalDays,bd:S.badges}))}
function readCode(code){code=code.replace(/\s+/g,'');const m=code.match(/^HM([12])\.(.+)$/);if(!m)throw new Error('format');const o=JSON.parse(b64dec(m[2]));if(!Array.isArray(o.s))throw new Error('format');return o}
function mergeBackup(o){
  let n=0;
  for(const [k,c,w,s,iv,d] of o.s){if(typeof k!=='string')continue;const cur=S.stats[k];if(!cur||(c+w)>(cur.c+cur.w)){S.stats[k]={c:+c||0,w:+w||0,s:+s||0,iv:+iv||0,d:d?+d:dayIdx()};n++}}
  for(const [day,v] of Object.entries(o.d||{})){const cur=S.days[day];if(v&&(!cur||v.n>cur.n))S.days[day]={n:+v.n||0,c:+v.c||0}}
  if(o.c){for(const c of o.c.ja||[])if(c&&c.w&&!S.custom.ja.some(x=>x.w===c.w&&x.r===c.r))S.custom.ja.push({w:String(c.w),r:String(c.r),m:String(c.m)});
    for(const c of o.c.en||[])if(c&&c.w&&!S.custom.en.some(x=>x.w===c.w))S.custom.en.push({w:String(c.w),m:String(c.m)})}
  for(const k of o.f||[])S.fav[k]=1;
  for(const [k,v] of Object.entries(o.b||{}))S.best[k]=Math.max(S.best[k]||0,+v||0);
  Object.assign(S.goalDays,o.g||{});for(const b of o.bd||[])if(!S.badges.includes(b))S.badges.push(b);
  rebuildWords();save();return n;
}

      +(hasTTS?card('elisten',ICO.listen,'듣기',sub('elisten'),'el',ITEMS.el.map(s=>s.key)):'');
    const weakW=EN_WORDS.filter(w=>isWeak(w.key)).slice(0,10);
    if(weakW.length)weakHTML=`<section><h2 class="sec-title">자주 틀리는 단어</h2><div class="weak" lang="en">${weakW.map(w=>`<span style="font-family:var(--f-en);font-size:16px">${esc(w.w)}</span>`).join('')}</div></section>`;
  }
  const dl=dueList();const dueN=dl.reduce((a,x)=>a+x[1],0);
  const dueHTML=`<section><h2 class="sec-title">오늘의 복습</h2><div class="panel due" style="padding:14px">
    ${dueN?`<div class="due-n"><b class="num">${dueN}</b><span>문제가 복습할 때가 됐어요</span></div><p class="note">${dl.map(([m,n])=>`${DUE_LABEL[m]} ${n}`).join(' · ')}</p><button class="btn primary" data-duestart="${dl[0][0]}">복습 시작</button>`
      :`<p style="margin:0;font-weight:600">오늘 복습할 문제가 없어요</p>`}
    <p class="note">맞힌 문제는 1일 → 3일 → 7일 → 14일 → 30일 간격으로 다시 나오고, 틀린 문제는 바로 다시 나와요.</p></div></section>`;
  const sents=ja?SENTS:EN_SENTS;
  const scenesHTML=`<section><h2 class="sec-title">상황별 회화 연습</h2><div class="chips">${Object.entries(SCENES).map(([v,l])=>`<button class="chip" data-goscene="${v}">${l} ${sents.filter(s=>s.sc===v).length}</button>`).join('')}</div></section>`;
  const goal=S.set.goal,gDone=goal&&d.n>=goal,pct=goal?Math.min(100,d.n/goal*100):0;
  const goalHTML=goal?`<div class="goal" data-done="${!!gDone}"><svg viewBox="0 0 60 60" aria-hidden="true"><circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" cx="30" cy="30" r="25" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100-pct}"/></svg><div><span class="lbl">오늘 목표</span><b class="num">${d.n} / ${goal}문제</b><small>${gDone?'달성했어요. 하나마루!':`${goal-d.n}문제 남았어요`}</small></div></div>`:'';
  const standalone=window.navigator.standalone===true||window.matchMedia?.('(display-mode: standalone)').matches;
  const segRow=(label,smallTxt,key,opts)=>`<div class="set-row"><div><b>${label}</b>${smallTxt?`<small>${smallTxt}</small>`:''}</div><div class="seg" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button data-setk="${key}" data-v="${v}" aria-pressed="${String(S.set[key])===String(v)}">${l}</button>`).join('')}</div></div>`;
  const sw=(key,label,smallTxt)=>`<div class="set-row"><div><b>${label}</b>${smallTxt?`<small>${smallTxt}</small>`:''}</div><button class="switch" role="switch" data-sw="${key}" aria-checked="${S.set[key]}" aria-label="${label}"></button></div>`;
  view.innerHTML=`<div class="home">
    <section>
      <h1 class="h1">오늘의 연습</h1><p class="date">${dstr}</p>
      ${goalHTML}
      <div class="kpis">
        <div class="kpi"><b class="num">${d.n}</b><span>오늘 푼 문제</span></div>
        <div class="kpi"><b class="num">${d.n?Math.round(d.c/d.n*100)+'%':'–'}</b><span>오늘 정답률</span></div>
        <div class="kpi"><b class="num">${streak()}일</b><span>연속 학습</span></div>
      </div>
    </section>
    ${dueHTML}
    <section><h2 class="sec-title">${ja?'일본어':'영어'} 학습</h2><div class="mods">${mods}</div></section>
    ${scenesHTML}
    ${weakHTML}
    <section><h2 class="sec-title">설정</h2><div class="panel">
      ${segRow('하루 목표','푼 문제 수 기준','goal',[[0,'끄기'],[10,'10'],[20,'20'],[30,'30'],[50,'50']])}
      ${segRow('한 라운드 문제 수','','round',[[10,'10'],[20,'20'],[30,'30']])}
      ${sw('autoNext','맞히면 자동으로 다음 문제','문자·단어 연습에 적용')}
      ${hasTTS?sw('autoSpeak','답 확인 후 자동 발음','아이폰 무음 모드에서는 소리가 나지 않아요')+sw('slow','천천히 발음',''):''}
      ${segRow('화면 테마','','theme',[['auto','자동'],['light','밝게'],['dark','어둡게']])}
      ${segRow('글자 크기','','zoom',[[1,'보통'],[1.1,'크게'],[1.2,'아주 크게']])}
    </div></section>
    <section><h2 class="sec-title">기록 백업</h2><div class="panel backup" style="padding:14px;display:grid;gap:10px">
      <p class="note">학습 기록은 이 기기에만 저장돼요. 휴대폰을 바꾸거나 Safari 데이터를 지우기 전에 백업 코드를 복사해서 메모 앱이나 '카톡 나에게 보내기'에 보관하세요. 내 단어와 즐겨찾기도 함께 저장돼요.</p>
      <div class="row"><button class="btn" data-bk="copy">백업 코드 복사</button><button class="btn" data-bk="open">코드로 복원</button></div>
      ${bk.mode==='show'?`<textarea id="bkOut" readonly aria-label="백업 코드">${esc(bk.code)}</textarea>`:''}
      ${bk.mode==='import'?`<textarea id="bkIn" placeholder="HM2. 으로 시작하는 백업 코드를 붙여 넣으세요" aria-label="백업 코드 입력">${esc(bk.input)}</textarea><button class="btn primary" data-bk="restore">복원하기</button><p class="note">지금 기록과 합쳐져요. 같은 문제는 더 많이 푼 쪽 기록을 남겨요.</p>`:''}
      ${bk.msg?`<p class="note" style="color:var(--ink)">${esc(bk.msg)}</p>`:''}
    </div></section>
    ${standalone?'':`<section><h2 class="sec-title">아이폰 홈 화면에 추가</h2><div class="panel" style="padding:14px">
      <ol class="steps"><li>Safari에서 이 앱 주소를 엽니다.</li><li>아래쪽 공유 버튼(네모에 위쪽 화살표)을 누릅니다.</li><li>'홈 화면에 추가'를 누르면 앱 아이콘이 생깁니다.</li></ol></div></section>`}
    <section class="danger">${confirmReset?`<span class="note">학습 기록을 모두 지울까요?</span><button class="btn" data-reset="yes" style="color:var(--ng)">지우기</button><button class="btn quiet" data-reset="no">취소</button>`:`<button class="btn quiet" data-reset="ask">학습 기록 초기화</button>`}</section>
  </div>`;
  view.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    const resetAll=()=>{for(const k in R)R[k]=null};
    if(b.dataset.gotab){for(const m of tabModes(b.dataset.gotab))if(S.filt[m]==='due'){S.filt[m]='all';R[m]=null}go(b.dataset.gotab)}
    else if(b.dataset.review){S.filt[b.dataset.review]='weak';R[b.dataset.review]=null;startMod(b.dataset.review)}
    else if(b.dataset.duestart)startDue(b.dataset.duestart);
    else if(b.dataset.goscene){S.scenes[S.lang]=[b.dataset.goscene];for(const m of SCENE_MODS){R[m]=null;if(modLang(m)===S.lang&&S.filt[m]!=='all')S.filt[m]='all'}save();go(ja?'sent':'esent')}
    else if(b.dataset.setk){const k=b.dataset.setk;const v=b.dataset.v;S.set[k]=(k==='theme')?v:+v;if(k==='round')resetAll();save();applyLook();renderHome()}
    else if(b.dataset.sw){S.set[b.dataset.sw]=!S.set[b.dataset.sw];save();renderHome()}
    else if(b.dataset.bk==='copy'){
      const code=makeCode();
      const fallback=()=>{bk={mode:'show',code,msg:'자동 복사가 안 돼요. 위 코드를 길게 눌러 전체 선택한 뒤 복사하세요.',input:''};renderHome();const t=document.getElementById('bkOut');if(t){t.focus();t.select()}};
      try{navigator.clipboard.writeText(code).then(()=>{bk={mode:null,msg:`백업 코드를 복사했어요 (${Object.keys(S.stats).length}개 문제 기록). 메모 앱 등에 붙여 넣어 보관하세요.`,code:'',input:''};renderHome()}).catch(fallback)}catch(err){fallback()}
    }
    else if(b.dataset.bk==='open'){bk={mode:bk.mode==='import'?null:'import',msg:'',code:'',input:''};renderHome();const t=document.getElementById('bkIn');if(t)t.focus()}
    else if(b.dataset.bk==='restore'){
      const val=(document.getElementById('bkIn')||{}).value||'';
      try{const n=mergeBackup(readCode(val));resetAll();bk={mode:null,msg:`복원했어요. 문제 기록 ${n}개를 합쳤어요.`,code:'',input:''}}
      catch(err){bk={mode:'import',msg:'코드를 읽을 수 없어요. HM 으로 시작하는 코드 전체를 빠짐없이 붙여 넣었는지 확인하세요.',code:'',input:val}}
      renderHome();
    }
    else if(b.dataset.reset){if(b.dataset.reset==='ask')confirmReset=true;else{if(b.dataset.reset==='yes'){S.stats={};S.days={};S.goalDays={};S.badges=[];S.best={};resetAll();save()}confirmReset=false}renderHome()}
  };
}

/* ================= quiz modules ================= */
const R={};
const setupOpen={};
const CHEV='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m4 6 4 4 4-4"/></svg>';
const seg=(path,opts,cur)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${path}" data-val="${v}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;
const catSum=(sel,cats)=>Object.keys(cats).every(c=>sel.includes(c)||c==='mine')?'전체':sel.map(c=>catName(cats,c)).join('·');
function catChips(path,cats,sel,favKey,favN){
  const hasMine=(path==='word.cats'?S.custom.ja:S.custom.en).length>0;
  const keys=Object.keys(cats).filter(k=>k!=='mine'||hasMine);
  const all=keys.every(k=>sel.includes(k));const ent=keys.map(k=>[k,cats[k]]);
  const chip=([v,[l]])=>`<button class="chip" data-multi="${path}" data-val="${v}" aria-pressed="${!all&&sel.includes(v)}">${l}</button>`;
  return `<div class="setup-row"><label>주제</label><div class="chips"><button class="chip" data-allcats aria-pressed="${all&&!S[favKey].fav}">전체</button>${ent.filter(e=>e[1][1]==='topic').map(chip).join('')}</div></div>
    <div class="setup-row"><label>상황</label><div class="chips">${ent.filter(e=>e[1][1]==='scene').map(chip).join('')}</div></div>
    <div class="setup-row"><label>즐겨찾기</label><div class="chips"><button class="chip" data-favonly="${favKey}" aria-pressed="${S[favKey].fav}">★ 즐겨찾기만 ${favN}</button></div></div>`;
}
function sceneChips(lang){
  const sel=S.scenes[lang];const all=sel.length===Object.keys(SCENES).length;const items=lang==='ja'?SENTS:EN_SENTS;
  return `<div class="setup-row"><label>상황</label><div class="chips"><button class="chip" data-allscenes aria-pressed="${all}">전체</button>${Object.entries(SCENES).map(([v,l])=>`<button class="chip" data-scene="${v}" aria-pressed="${!all&&sel.includes(v)}">${l} ${items.filter(s=>s.sc===v).length}</button>`).join('')}</div></div>`;
}
const ansRow=()=>`<div class="setup-row"><label>답 방식</label>${seg('set.wans',[['type','직접 쓰기'],['choice','4지선다']],S.set.wans)}</div>`;
const kanjiRow=lbl=>`<div class="setup-row"><label>${lbl}</label>${seg('set.kanji',[['true','한자+가나'],['false','가나만']],S.set.kanji)}</div>`;
const inputRow=()=>`<div class="setup-row"><label>입력 방식</label>${seg('kana.input',[['pad','앱 키패드'],['sys','아이폰 일본어 키보드']],S.kana.input)}<p class="note">웹앱은 아이폰 키보드 언어를 자동으로 바꿀 수 없어요. 앱 키패드는 설정 없이 바로 쓸 수 있고, 아이폰 키보드를 쓰려면 지구본 키로 일본어를 골라 주세요.</p></div>`;
const filt=m=>S.filt[m]||'all';
const favCount=lang=>(lang==='ja'?WORDS:EN_WORDS).filter(w=>S.fav[w.key]).length;

function setupHTML(mod){
  let sum='',body='';const lang=modLang(mod);
  if(mod==='kana'){
    const k=S.kana;
    sum=[{h:'ひらがな',k:'カタカナ',m:'ひらがな+カタカナ'}[k.script],k.dir==='k2r'?'문자→발음':'발음→문자',k.sets.map(s=>SETS[s].split(' ')[0]).join('·')].join(' · ');
    body=`<div class="setup-row"><label>문제 방향</label>${seg('kana.dir',[['k2r','문자 보고 발음 쓰기'],['r2k','발음 보고 문자 쓰기']],k.dir)}</div>
      <div class="setup-row"><label>문자</label>${seg('kana.script',[['h','ひらがな'],['k','カタカナ'],['m','섞기']],k.script)}</div>
      <div class="setup-row"><label>범위</label><div class="chips">${Object.entries(SETS).map(([v,l])=>`<button class="chip" data-multi="kana.sets" data-val="${v}" aria-pressed="${k.sets.includes(v)}">${l}</button>`).join('')}</div></div>
      ${k.dir==='r2k'?inputRow():''}`;
  }else if(mod==='kconf'){
    sum={h:'ひらがな',k:'カタカナ',m:'ひらがな+カタカナ'}[S.kconf.script]+' · 모양이 비슷한 글자';
    body=`<div class="setup-row"><label>문자</label>${seg('kconf.script',[['h','ひらがな'],['k','カタカナ'],['m','섞기']],S.kconf.script)}</div><p class="note">シ/ツ, ソ/ン, ぬ/め처럼 헷갈리는 글자끼리 묶어서 출제해요. 기록은 문자 퀴즈와 함께 쌓여요.</p>`;
  }else if(mod==='word'){
    sum=[S.word.fav?'★ 즐겨찾기':catSum(S.word.cats,CATS),S.set.wans==='choice'?'4지선다':'직접 쓰기',S.set.kanji?'한자+가나':'가나만'].join(' · ');
    body=catChips('word.cats',CATS,S.word.cats,'word',favCount('ja'))+ansRow()+kanjiRow('표기');
  }else if(mod==='loan'){
    sum=`외래어 ${LOANS.length}개 · 원래 영어 고르기`;
    body=`<p class="note">가타카나로 쓰는 외래어를 읽고 원래 영어 단어를 골라요. 일본에서 만든 영어(일본식 영어)는 설명이 함께 나와요.</p>`;
  }else if(mod==='conj'){
    sum=S.conj.forms.map(f=>FORM_SHORT[f]).join('·')+' · '+(S.set.kanji?'한자+가나':'가나만');
    body=`<div class="setup-row"><label>활용형</label><div class="chips">${Object.keys(FORMS).map(f=>`<button class="chip" data-multi="conj.forms" data-val="${f}" aria-pressed="${S.conj.forms.includes(f)}">${FORMS[f]}</button>`).join('')}</div></div>`+kanjiRow('표기')+
      `<p class="note">1그룹(う동사)은 끝소리를 바꾸고, 2그룹(る동사)은 る를 떼고 붙이고, する·来る는 불규칙이에요.</p>`;
  }else if(mod==='ew'){
    sum=[S.ew.dir==='e2k'?'영어→뜻':'뜻→영어',S.ew.fav?'★ 즐겨찾기':catSum(S.ew.cats,EN_CATS),S.set.wans==='choice'?'4지선다':'직접 쓰기'].join(' · ');
    body=`<div class="setup-row"><label>문제 방향</label>${seg('ew.dir',[['e2k','영어 보고 뜻'],['k2e','뜻 보고 영어']],S.ew.dir)}</div>`+catChips('ew.cats',EN_CATS,S.ew.cats,'ew',favCount('en'))+ansRow();
  }else if(NUMS.has(mod)){
    const sel=S.num[lang];const L={price:'가격',time:'시간',number:'숫자'};
    sum=sel.map(t=>L[t]).join('·')+' 듣고 숫자로 쓰기';
    body=`<div class="setup-row"><label>종류</label><div class="chips">${Object.entries(L).map(([v,l])=>`<button class="chip" data-numt="${v}" aria-pressed="${sel.includes(v)}">${l}</button>`).join('')}</div></div><p class="note">문제가 매번 새로 만들어져서 끝없이 연습할 수 있어요. 시간은 6시 30분이면 630처럼 숫자만 써도 돼요.</p>`;
  }else{
    const sel=S.scenes[lang];
    sum=(sel.length===Object.keys(SCENES).length?'모든 상황':sel.map(s=>SCENES[s]).join('·'))+(lang==='ja'&&!DICT.has(mod)&&!LISTEN.has(mod)?' · '+(S.set.kanji?'한자+가나':'가나만'):'');
    body=sceneChips(lang)+(lang==='ja'&&!LISTEN.has(mod)&&!DICT.has(mod)?kanjiRow(BUILD.has(mod)?'블록 표기':'보기 표기'):'')+(mod==='jd'?inputRow():'');
    if(LISTEN.has(mod)||DICT.has(mod))body+=`<p class="note">문제가 나오면 문장이 바로 재생돼요. 안 들리면 재생 버튼을 누르세요. 무음 모드에서는 소리가 나지 않아요.</p>`;
    if(mod==='jd')body+=`<p class="note">가타카나 단어도 히라가나로 써도 정답이에요. 조사 は·へ·を는 わ·え·お로 써도 돼요.</p>`;
    if(mod==='ed')body+=`<p class="note">대소문자와 문장부호는 채점하지 않아요. I'm과 I am처럼 줄임말은 둘 다 정답이에요.</p>`;
    if(BUILD.has(mod))body+=`<p class="note">필요 없는 블록이 하나 섞여 있어요. 놓은 블록을 누르면 다시 빠져요.</p>`;
  }
  if(srsMods().includes(mod)||mod==='kconf'){
    const f=filt(mod);const wc=basePool(mod,false).filter(p=>isWeak(p.key)).length;
    if(f!=='all')sum=(f==='due'?'오늘 복습 · ':'오답 복습 · ')+sum;
    body+=`<div class="setup-row"><label>출제</label><div class="chips"><button class="chip" data-filt="all" aria-pressed="${f==='all'}">전체에서 출제</button><button class="chip warn" data-filt="weak" aria-pressed="${f==='weak'}">틀린 것만 ${wc}</button>${mod!=='kconf'?`<button class="chip warn" data-filt="due" aria-pressed="${f==='due'}">오늘 복습 ${dueCount(mod)}</button>`:''}</div><p class="note">틀린 문제는 다시 맞힐 때까지 더 자주 나와요.</p></div>`;
  }
  const open=!!setupOpen[mod];
  return `<div class="setup" data-open="${open}"><button class="setup-sum" aria-expanded="${open}"><span>${esc(sum)}</span>${CHEV}</button><div class="setup-body" ${open?'':'hidden'}>${body}</div></div>`;
}

function basePool(mod,full){
  const lang=modLang(mod);const inScene=s=>S.scenes[lang].includes(s.sc);
  if(mod==='kana'){
    if(full)return KANA.flatMap(x=>['h','k'].map(sc=>{const ch=sc==='h'?x.h:toKata(x.h);return {...x,ch,sc,key:'k:'+ch}}));
    const k=S.kana;const scripts=k.script==='m'?['h','k']:[k.script];
    return KANA.filter(x=>k.sets.includes(x.set)).flatMap(x=>scripts.map(sc=>{const ch=sc==='h'?x.h:toKata(x.h);return {...x,ch,sc,key:'k:'+ch}}));
  }
  if(mod==='kconf')return CONF_ITEMS.filter(x=>S.kconf.script==='m'||x.sc===S.kconf.script);
  if(mod==='word')return full?WORDS:WORDS.filter(w=>S.word.fav?S.fav[w.key]:w.cats.some(c=>S.word.cats.includes(c)));
  if(mod==='ew')return full?EN_WORDS:EN_WORDS.filter(w=>S.ew.fav?S.fav[w.key]:w.cats.some(c=>S.ew.cats.includes(c)));
  if(mod==='loan')return LOANS;

  if(!padVal)return;const last=padVal.slice(-1);const kata=last!==toHira(last);let h=toHira(last),n=null;

const kNorm=s=>s.normalize('NFC').toLowerCase().replace(/\(.*?\)/g,'').replace(/[\s.,!?~·・'"“”‘’\-…]/g,'');
const kStem=s=>s.replace(/(입니다|이에요|예요|해요|요|다)$/,'');
function meaningOk(input,ms){const a=kNorm(input);if(!a)return false;return ms.some(m=>{const b=kNorm(m);return a===b||kStem(a)===kStem(b)&&kStem(a).length>0})}
function markWord(text,cands,ci){
  const list=[];for(const c of cands){if(!c)continue;list.push(c);if([...c].length>=3)list.push(c.slice(0,-1))}
  for(const c of list){const idx=ci?text.toLowerCase().indexOf(c.toLowerCase()):text.indexOf(c);if(idx>=0)return esc(text.slice(0,idx))+'<mark>'+esc(text.slice(idx,idx+c.length))+'</mark>'+esc(text.slice(idx+c.length))}
  return esc(text);
}
function wordOptions(q,all,mode,lang){
  const qm=new Set(q.m.map(kNorm));
  const label=x=>mode==='en'?x.w:x.m.slice(0,2).join(', ');
  const ql=label(q);
  const okx=x=>x!==q&&!x.m.some(m=>qm.has(kNorm(m)))&&label(x)!==ql&&x.w!==q.w;
  let c=shuffle(all.filter(x=>okx(x)&&x.cats.some(k=>q.cats.includes(k))));
  if(c.length<3)c=c.concat(shuffle(all.filter(x=>okx(x)&&!c.includes(x))));
  const sub=x=>mode==='en'?x.m.slice(0,2).join(', '):(lang==='ja'?(x.w!==x.r?`${x.w} · ${x.r}`:x.w):x.w);
  const mk=(x,ok)=>({t:label(x),ok,sub:sub(x),cls:mode==='en'?'en':'ko-opt',lang:mode==='en'?'en':'',subCls:mode==='en'?'':(lang==='ja'?'jp':'en'),subLang:mode==='en'?'':lang});
  return shuffle([mk(q,true),...c.slice(0,3).map(x=>mk(x,false))]);
}

  if(mod==='sent')return [{t:q.a[0],rd:q.a[1],ko:q.k,ok:true},...q.d.map(d=>({t:d[0],rd:d[1],ko:d[2],ok:false}))];
  if(mod==='jl')return [{t:q.k,ko:q.a[0],ok:true},...q.d.map(d=>({t:d[2],ko:d[0],ok:false}))];
  if(mod==='es')return [{t:q.a,ko:q.k,ok:true},...q.d.map(d=>({t:d[0],ko:d[1],ok:false}))];
  return [{t:q.k,ko:q.a,ok:true},...q.d.map(d=>({t:d[1],ko:d[0],ok:false}))];
}
const sentText=(mod,q)=>modLang(mod)==='ja'?q.a[0]:q.a;

/* ---------- sentence building ---------- */
function buildTokens(mod,s){
  if(mod==='jb'){const tk=s.t.split(' '),rk=s.a[1].split(' ');return tk.map((k,i)=>({k:stripP(k),r:stripP(rk[i]||k)})).filter(x=>x.k)}
  return s.a.split(' ').map(w=>({k:stripP(w),r:stripP(w)})).filter(x=>x.k);
}
function decoyFor(mod,q,ans){
  const pool=mod==='jb'?SENTS:EN_SENTS;const used=new Set(ans.map(x=>x.k.toLowerCase()));
  for(let tries=0;tries<40;tries++){const s=pool[Math.random()*pool.length|0];if(s.k===q.k)continue;
    const toks=buildTokens(mod,s).filter(x=>!used.has(x.k.toLowerCase())&&[...x.k].length>1);
    if(toks.length)return toks[Math.random()*toks.length|0]}
  return null;
}
function showBuild(mod,q,card,zone,r){
  const jp=mod==='jb';
  if(!r.bank){const ans=buildTokens(mod,q);r.ans=ans;const dec=decoyFor(mod,q,ans);r.bank=shuffle([...ans,...(dec?[dec]:[])].map((x,i)=>({...x,id:i})));r.built=[]}
  const disp=x=>jp&&!S.set.kanji?x.r:x.k;const cls=jp?'jp':'en',lg=jp?'ja':'en';
  card.innerHTML=`<span class="cat">${SCENES[q.sc]||''} · 문장 조립</span><p class="ko">${esc(q.k)}</p><p class="cap">블록을 순서대로 눌러 ${jp?'일본어':'영어'} 문장을 만드세요</p>`;
  zone.dataset.type='build';
  const st=r.answered?(r.lastOk?'ok':'ng'):'';
  const byId=id=>r.bank.find(b=>b.id===id);
  zone.innerHTML=`<div class="build"><div class="build-line" id="bline" ${st?`data-state="${st}"`:''}>${r.built.map((id,pos)=>`<button type="button" class="blk ${cls}" data-u="${pos}" lang="${lg}">${esc(disp(byId(id)))}</button>`).join('')}</div><div class="bank">${r.bank.map(x=>`<button type="button" class="blk ${cls}${r.built.includes(x.id)?' used':''}" data-b="${x.id}" lang="${lg}">${esc(disp(x))}</button>`).join('')}</div>
    ${r.answered?'':`<div class="row"><button type="button" class="btn" data-act="bclear">다시 놓기</button><button type="button" class="btn primary" data-act="bcheck">확인</button></div>`}
    <div class="sub-actions"><button type="button" class="btn quiet" data-act="skip">${r.answered?'다음':'모르겠어요'}</button></div></div>`;
}
function checkBuild(mod,skip){
  const r=R[mod],q=r.qs[r.i];if(r.answered)return;
  if(!skip&&!r.built.length)return;
  const jp=mod==='jb';const byId=id=>r.bank.find(b=>b.id===id);
  const got=r.built.map(byId);
  const ok=!skip&&got.length===r.ans.length&&got.every((x,i)=>x.k.toLowerCase()===r.ans[i].k.toLowerCase());
  const shown=got.map(x=>jp&&!S.set.kanji?x.r:x.k).join(jp?'':' ');
  const body=`<div class="fb-head"><span class="badge">${ok?'〇':'×'}</span>${ok?'정답':skip?'정답 확인':'오답'}</div>${!ok&&!skip?`<p class="fb-sub given">만든 문장: <s>${esc(shown)}</s></p>`:''}${sentFeedback(mod,q)}`;
  finish(mod,q,ok,shown,body,!ok&&!skip);
  showBuild(mod,q,document.getElementById('card'),document.getElementById('zone'),r);
  if(S.set.autoSpeak)speak(sentText(mod,q),modLang(mod));
}

/* ---------- dictation ---------- */
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const PART={'は':'(?:は|わ)','へ':'(?:へ|え)','を':'(?:を|お)','では':'(?:では|でわ)','には':'(?:には|にわ)'};
function showDict(mod,q,card,zone,r,focus){
  const ja=mod==='jd';const fresh=!r.started;r.started=true;
  card.innerHTML=`<span class="cat">${SCENES[q.sc]||''} · 받아쓰기</span><button type="button" class="qbtn" data-act="reveal" aria-expanded="${!!(r.revealed||r.answered)}" aria-label="뜻 보기">?</button>${playBox(`<p class="cap" id="rd" ${r.revealed||r.answered?'':'hidden'}>뜻: ${esc(q.k)}</p>`)}<p class="cap">${ja?'들은 문장을 가나로 쓰세요':'들은 문장을 영어로 쓰세요'} · ? 를 누르면 뜻</p>`;
  if(ja&&S.kana.input==='pad'){
    padMax=60;
    if(zone.dataset.type!=='pad-h'){zone.dataset.type='pad-h';zone.innerHTML=padHTML('h')}
    if(!r.answered)padVal='';
    renderPad(r.answered?(r.lastOk?'ok':'ng'):'');
  }else{
    answerForm(zone,'dict-'+mod,ja?'lang="ja" placeholder="일본어로 입력"':'lang="en" placeholder="들은 문장을 입력"',mod,ja?'ja':'');prepInput(zone,r,focus);
  }
  if(fresh&&!r.answered)speak(sentText(mod,q),ja?'ja':'en');
}
function checkDict(mod,val,skip){
  const r=R[mod],q=r.qs[r.i];if(r.answered)return;
  const given=(val||'').trim();if(!skip&&!given)return;
  const ja=mod==='jd';let ok=false,diff='';
  if(ja){
    const toks=q.a[1].split(' ').map(t=>toHira(stripAll(t))).filter(Boolean);
    const re=new RegExp('^'+toks.map(t=>PART[t]||reEsc(t)).join('')+'$');
    const u=toHira(stripAll(given));ok=!skip&&re.test(u);
    if(!ok&&!skip){const tgt=[...toks.join('')],uc=[...u];const {inA,inB}=lcsMark(uc,tgt);
      diff=`<p class="fb-sub diff">내 답: <span class="jp" style="font-size:17px;color:var(--ink)">${uc.map((c,i)=>inA[i]?esc(c):`<span class="bad">${esc(c)}</span>`).join('')}</span></p><p class="fb-sub diff">빠진 글자: <span class="jp" style="font-size:17px;color:var(--ink)">${tgt.map((c,i)=>inB[i]?esc(c):`<span class="miss">${esc(c)}</span>`).join('')}</span></p>`}
  }else{
    const u=enWords(given),t=enWords(q.a);ok=!skip&&u.join(' ')===t.join(' ');
    if(!ok&&!skip){const {inA,inB}=lcsMark(u,t);
      diff=`<p class="fb-sub diff">내 답: <span style="color:var(--ink)">${u.map((w,i)=>inA[i]?esc(w):`<span class="bad">${esc(w)}</span>`).join(' ')}</span></p><p class="fb-sub diff">정답과 비교: <span style="color:var(--ink)">${t.map((w,i)=>inB[i]?esc(w):`<span class="miss">${esc(w)}</span>`).join(' ')}</span></p>`}
  }
  const body=`<div class="fb-head"><span class="badge">${ok?'〇':'×'}</span>${ok?'정답':skip?'정답 확인':'오답'}</div>${diff}${sentFeedback(mod,q)}`;
  finish(mod,q,ok,given,body,!ok&&!skip);
  const inp=document.getElementById('ans');if(inp)inp.dataset.state=ok?'ok':'ng';
  renderPad(ok?'ok':'ng');
  const rd=document.getElementById('rd');if(rd)rd.hidden=false;
}

  const info=`<p class="fb-big ${ja?'':'en'}" ${ja?'lang="ja"':'lang="en"'}>${esc(q.show)}</p><p class="fb-sub ${ja?'':'en'}" ${ja?'lang="ja" style="font-family:var(--f-jp);font-size:16px"':''}>${esc(q.read)}</p>${ja?`<p class="fb-sub mono">${esc(romaji(q.read))}</p>`:''}<div>${spkBtn(q.say,'다시 듣기',ja?'ja':'en')}</div>`;
  finish(mod,q,res,(val||'').trim(),resultBody(res,skip,(val||'').trim(),info));
  const inp=document.getElementById('ans');if(inp)inp.dataset.state=res?'ok':'ng';
  showNum(mod,q,document.getElementById('card'),document.getElementById('zone'),r,false);
}

const CHECK={kana:checkKana,word:checkWord,ew:checkEW,jb:(v,s)=>checkBuild('jb',s),eb:(v,s)=>checkBuild('eb',s),
  jd:(v,s)=>checkDict('jd',v,s),ed:(v,s)=>checkDict('ed',v,s),jn:(v,s)=>checkNumQ('jn',v,s),enn:(v,s)=>checkNumQ('enn',v,s),
  loan:(v,s)=>checkLoan(-1,s),conj:(v,s)=>checkConj(-1,s)};

/* ---------- shared flow ---------- */
function reportText(mod,q,given){
  let p='',a='';
  if(mod==='kana'){p=q.ch;a=q.alts[0]}else if(mod==='kconf'){p=q.ch;a=kanaRom(q.ch)}
  else if(mod==='word'){p=`${q.w} (${q.r})`;a=q.m.join(', ')}else if(mod==='ew'){p=q.w;a=q.m.join(', ')}
  else if(mod==='loan'){p=q.k;a=q.en}else if(mod==='conj'){p=`${q.v.w} → ${FORM_SHORT[q.form]}`;a=q.right.w}
  else if(NUMS.has(mod)){p=q.say;a=q.show}else{p=q.k;a=modLang(mod)==='ja'?q.a[0]:q.a}
  return `[하나마루 문제 신고]\n종류: ${MODE_LABEL[mod]}\n문제: ${p}\n정답: ${a}\n내 답: ${given||'-'}\n이상한 점: `;
}
function finish(mod,q,ok,given,body,canOverride){
  const r=R[mod];const prev=record(q.key,ok);
  r.answered=true;r.lastOk=ok;r.mark=ok?'ok':'ng';r.res.push({q,ok,given,prev});
  const last=r.i===r.qs.length-1;
  r.fb=`<div class="fb-box ${ok?'ok':'ng'}">${body}</div><div class="fb-actions">${canOverride?`<button type="button" class="btn" data-act="override">맞은 걸로 처리</button>`:''}<button type="button" class="btn primary" data-act="next">${last?'결과 보기':'다음 문제'}</button></div><div class="fb-more"><button type="button" class="link" data-act="report">문제가 이상해요</button></div>`;
  document.getElementById('card').dataset.mark=r.mark;
  document.getElementById('fb').innerHTML=r.fb;
  updateProg(mod);
}
function override(mod){
  const r=R[mod];const last=r.res[r.res.length-1];if(!last||last.ok)return;
  forceCorrect(last.q.key,last.prev);last.ok=true;r.lastOk=true;r.mark='ok';
  r.fb=r.fb.replace('fb-box ng','fb-box ok').replace(/<span class="badge">×<\/span>오답/,'<span class="badge">〇</span>정답으로 바꿨어요').replace(/<button type="button" class="btn" data-act="override">.*?<\/button>/,'');
  document.getElementById('card').dataset.mark='ok';document.getElementById('fb').innerHTML=r.fb;
  const inp=document.getElementById('ans');if(inp)inp.dataset.state='ok';
  if(BUILD.has(mod))showBuild(mod,last.q,document.getElementById('card'),document.getElementById('zone'),r);
  else renderPad('ok');
  updateProg(mod);
}
function next(mod){
  clearAdv();const r=R[mod];if(!r||!r.answered)return;
  r.i++;r.answered=false;r.fb='';r.mark='';r.revealed=false;r.chosen=null;r.order=null;r.bank=null;r.built=null;r.ans=null;r.started=false;
  if(r.i>=r.qs.length)r.done=true;
  if(activeMod()===mod)showQ(mod,true);
}
function formEnter(mod){
  const r=R[mod];const inp=document.getElementById('ans');
  if(r.answered){next(mod);return}
  CHECK[mod](inp.value);
}
function stageClick(mod,e){
  const b=e.target.closest('button');if(!b||b.dataset.speak)return;
  const act=b.dataset.act;const r=R[mod];const q=r&&!r.done&&r.qs[r.i];
  const card=()=>document.getElementById('card'),zone=()=>document.getElementById('zone');
  if(act==='next')next(mod);
  else if(act==='skip'){if(r.answered)next(mod);else if(CHECK[mod])CHECK[mod]('',true)}
  else if(act==='override')override(mod);
  else if(act==='report'){const txt=reportText(mod,q,r.res[r.res.length-1]?.given);copyText(txt,'신고 내용을 복사했어요. 카톡으로 앱 만든 사람에게 보내 주세요.',()=>{const fb=document.getElementById('fb');if(fb&&!fb.querySelector('#rpt')){fb.insertAdjacentHTML('beforeend',`<textarea id="rpt" style="width:100%;min-height:110px;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink)" readonly>${esc(txt)}</textarea><p class="note">위 내용을 길게 눌러 복사한 뒤 보내 주세요.</p>`);const t=fb.querySelector('#rpt');t.focus();t.select()}})}
  else if(act==='fav'){const k=b.dataset.key;if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();const on=!!S.fav[k];b.setAttribute('aria-pressed',on);b.textContent=on?'★ 즐겨찾기됨':'☆ 즐겨찾기';r.fb=document.getElementById('fb').innerHTML}
  else if(act==='reveal'){r.revealed=!r.revealed||r.answered;b.setAttribute('aria-expanded',r.revealed);
    if(mod==='word'||DICT.has(mod)){document.getElementById('rd').hidden=!r.revealed}
    else if(mod==='ew'){document.getElementById('rd').hidden=!r.revealed;const p=document.getElementById('pat');if(p&&!r.answered)p.innerHTML=patHTML(q.w,r.revealed?'hint':'');if(r.revealed&&S.ew.dir==='e2k')speak(q.w,'en')}
    else document.querySelectorAll('.opt .rd').forEach(x=>x.hidden=!r.revealed)}
  else if(act==='play'||act==='playslow'){if(q)speak(NUMS.has(mod)?q.say:sentText(mod,q),modLang(mod),act==='playslow')}
  else if(act==='retry'){newRound(mod,uniqueMissed(mod));showQ(mod,false)}
  else if(act==='again'){newRound(mod);showQ(mod,false)}
  else if(act==='duecont'){S.filt[mod]='due';newRound(mod);showQ(mod,false)}
  else if(act==='duenext')startDue(b.dataset.mod);
  else if(act==='bclear'){if(!r.answered){r.built=[];showBuild(mod,q,card(),zone(),r)}}
  else if(act==='bcheck')checkBuild(mod,false);
  else if(b.dataset.b!==undefined){if(!r.answered){const id=+b.dataset.b;if(!r.built.includes(id))r.built.push(id);showBuild(mod,q,card(),zone(),r)}}
  else if(b.dataset.u!==undefined){if(!r.answered){r.built.splice(+b.dataset.u,1);showBuild(mod,q,card(),zone(),r)}}
  else if(b.dataset.wopt!==undefined){if(r.answered)return;const i=+b.dataset.wopt;
    if(mod==='loan')checkLoan(i);else if(mod==='conj')checkConj(i);else{r.chosen=i;const ok=r.order[i].ok;if(mod==='word')gradeWord(q,ok,'',false);else gradeEW(q,ok,'',false)}}
  else if(b.dataset.opt!==undefined){if(r.answered)return;if(mod==='kconf')checkConf(+b.dataset.opt);else checkChoice(mod,+b.dataset.opt)}
  else if(b.classList.contains('k')||b.closest('.pad-fn'))padKey(mod,b);
}
function uniqueMissed(mod){const seen=new Set();return R[mod].res.filter(x=>!x.ok).map(x=>x.q).filter(q=>NUMS.has(mod)||!seen.has(q.key)&&seen.add(q.key))}
function summary(mod){
  const r=R[mod];const st=document.getElementById('stage');
  const n=r.res.length,c=r.res.filter(x=>x.ok).length,pct=n?Math.round(c/n*100):0;
  const missed=r.res.filter(x=>!x.ok);
  const msg=pct===100?'전부 맞혔어요. 하나마루!':pct>=80?'잘했어요. 틀린 것만 한 번 더 보면 확실해져요.':pct>=50?'절반 넘게 맞혔어요. 틀린 문제를 다시 풀어 보세요.':'처음엔 다 어려워요. 틀린 것부터 천천히 다시 해 봐요.';
  const item=x=>{const q=x.q;
    if(mod==='kana'||mod==='kconf')return `<li><span class="jp" lang="ja">${q.ch}</span><span class="mono">${kanaRom(q.ch)}</span>${x.given?`<span class="s given">입력 <s>${esc(x.given)}</s></span>`:''}</li>`;
    if(mod==='word')return `<li><span class="jp" lang="ja">${esc(q.w)}</span><span class="s" lang="ja">${q.w!==q.r?esc(q.r)+' · ':''}${esc(q.m[0])}</span></li>`;
    if(mod==='ew')return `<li><span class="en" lang="en" style="font-size:19px;font-weight:600">${esc(q.w)}</span><span class="s">${esc(q.m.join(', '))}</span></li>`;
    if(mod==='loan')return `<li><span class="jp" lang="ja">${q.k}</span><span class="s">${esc(q.en)} · ${esc(q.ko)}</span></li>`;
    if(mod==='conj')return `<li><span class="jp" lang="ja">${esc(q.v.w)}</span><span class="s">${FORM_SHORT[q.form]} → <span class="jp" lang="ja">${esc(q.right.w)}</span></span></li>`;
    if(NUMS.has(mod))return `<li><span class="${mod==='jn'?'jp':'en'}">${esc(q.show)}</span><span class="s">${esc(q.read)}</span>${x.given?`<span class="s given">입력 <s>${esc(x.given)}</s></span>`:''}</li>`;
    if(modLang(mod)==='en')return `<li style="display:grid;gap:2px"><span>${esc(q.k)}</span><span class="en" lang="en" style="font-size:17px">${esc(q.a)}</span></li>`;
    return `<li style="display:grid;gap:2px"><span>${esc(q.k)}</span><span class="jp" lang="ja" style="font-size:17px">${q.a[0]}</span></li>`};
  let dueRow='';
  if(r.due){const left=dueCount(mod);const nx=dueList().find(([m])=>m!==mod);
    dueRow=left?`<button class="btn primary" data-act="duecont">이어서 복습 ${left}개</button>`:nx?`<button class="btn primary" data-act="duenext" data-mod="${nx[0]}">다음 복습: ${DUE_LABEL[nx[0]]} ${nx[1]}개</button>`:`<p class="sum-msg" style="color:var(--ok);font-weight:600">오늘 복습을 모두 끝냈어요!</p>`}
  st.innerHTML=`<div class="sum">
    <div class="sum-score">${pct>=80?`<svg viewBox="0 0 200 200" aria-hidden="true"><path pathLength="1" d="M108 18C162 16 190 60 184 108 178 156 134 186 92 182 44 178 14 142 18 96 22 52 60 24 106 26M110 64c24 2 38 20 36 42-2 22-22 38-44 36-20-2-34-20-32-40 2-18 18-30 36-28 16 2 26 14 24 28"/></svg>`:''}<b class="num">${c}</b><span class="num">/ ${n}</span></div>
    <p class="sum-msg">${msg}</p>
    ${dueRow?`<div class="row">${dueRow}</div>`:''}
    ${missed.length?`<div><p class="lbl" style="margin:0 0 6px">틀린 문제</p><ul class="miss">${missed.map(item).join('')}</ul></div>`:''}
    <div class="row">${missed.length?`<button class="btn ${dueRow?'':'primary'}" data-act="retry">틀린 ${uniqueMissed(mod).length}개 다시</button>`:''}<button class="btn ${missed.length||dueRow?'':'primary'}" data-act="again">새 라운드</button></div>
  </div>`;
  st.onclick=e=>stageClick(mod,e);
  updateProg(mod);
  document.getElementById('ptext').textContent='완료';
}

/* ================= 60-second challenge ================= */
let SP=null;
function stopSpeed(){if(SP){if(SP.timer){clearInterval(SP.timer);SP.timer=null}if(SP.lockT)clearTimeout(SP.lockT);SP.running=false}}
function speedQ(mod){
  if(mod==='kspeed'){const k=S.kana;const pool=KANA.filter(x=>k.sets.includes(x.set));const x=pool[Math.random()*pool.length|0];const sc=k.script==='m'?(Math.random()<0.5?'h':'k'):k.script;
    const ch=sc==='h'?x.h:toKata(x.h);const others=shuffle(pool.filter(y=>y!==x&&y.alts[0]!==x.alts[0])).slice(0,3);
    return {show:ch,cls:'glyph',lang:'ja',order:shuffle([{t:x.alts[0],ok:true,cls:'mono-opt'},...others.map(y=>({t:y.alts[0],ok:false,cls:'mono-opt'}))])}}
  const all=mod==='wspeed'?WORDS:EN_WORDS;const q=all[Math.random()*all.length|0];
  return {show:mod==='wspeed'?(S.set.kanji?q.w:q.r):q.w,cls:mod==='wspeed'?'word':'eword',lang:mod==='wspeed'?'ja':'en',order:wordOptions(q,all,'ko',mod==='wspeed'?'ja':'en')};
}
function renderSpeed(mod){
  const best=S.best[mod]||0;
  const setup=mod==='kspeed'?`<div class="setup-row"><label>문자</label>${seg('kana.script',[['h','ひらがな'],['k','カタカナ'],['m','섞기']],S.kana.script)}</div><div class="setup-row"><label>범위</label><div class="chips">${Object.entries(SETS).map(([v,l])=>`<button class="chip" data-multi="kana.sets" data-val="${v}" aria-pressed="${S.kana.sets.includes(v)}">${l}</button>`).join('')}</div></div>`
    :mod==='wspeed'?kanjiRow('표기'):'';
  const what=mod==='kspeed'?'글자를 보고 발음을':'단어를 보고 뜻을';
  view.innerHTML=`<section class="mod">${modeSeg(mod)}<div id="stage"><div class="empty" style="text-align:left;justify-items:stretch">
    <p style="margin:0;font-weight:700;font-size:18px">60초 도전</p>
    <p class="note">60초 동안 ${what} 최대한 많이 고르세요. 틀려도 바로 다음 문제로 넘어가요.</p>
    <div class="due-n"><b class="num">${best}</b><span>최고 기록</span></div>
    ${setup}
    <button class="btn primary" data-sp="start">시작</button>
  </div></div></section>`;
  bindModes();
  view.onclick=e=>{const b=e.target.closest('button');if(!b||b.closest('.modes'))return;
    if(b.dataset.sp==='start')startSpeed(mod);
    else if(b.dataset.set){const [g,k]=b.dataset.set.split('.');let v=b.dataset.val;if(v==='true'||v==='false')v=v==='true';S[g][k]=v;save();renderSpeed(mod)}
    else if(b.dataset.multi){const v=b.dataset.val;let arr=S.kana.sets;if(arr.includes(v)){if(arr.length>1)arr=arr.filter(x=>x!==v)}else arr=[...arr,v];S.kana.sets=Object.keys(SETS).filter(s=>arr.includes(s));save();renderSpeed(mod)}};
}
function startSpeed(mod){
  stopSpeed();SP={mod,running:true,end:Date.now()+60000,score:0,total:0,lock:false};
  const st=document.getElementById('stage');
  st.innerHTML=`<div class="speed-top"><span class="num" id="spT">60</span><div class="speed-bar"><i id="spBar"></i></div><b class="num" id="spS">0</b></div><div class="card" id="spCard"></div><div class="zone" id="spZone"></div>`;
  SP.timer=setInterval(()=>{if(!SP||!SP.running)return;const left=Math.max(0,SP.end-Date.now());const t=document.getElementById('spT'),bar=document.getElementById('spBar');if(t)t.textContent=Math.ceil(left/1000);if(bar)bar.style.width=(left/600)+'%';if(left<=0)endSpeed()},100);
  view.onclick=e=>{const b=e.target.closest('button[data-sopt]');if(b)answerSpeed(+b.dataset.sopt);else{const s=e.target.closest('button[data-sp]');if(s)speedEndClick(s)}};
  nextSpeed();
}
function nextSpeed(){
  if(!SP||!SP.running)return;SP.q=speedQ(SP.mod);SP.lock=false;const q=SP.q;
  const size=q.cls==='word'?wordSize(q.show):q.cls==='eword'?enSize(q.show):null;
  document.getElementById('spCard').innerHTML=q.cls==='glyph'?`<div class="tz"><span class="glyph ${q.show.length>1?'two':''}" lang="ja">${q.show}</span></div>`:`<div class="tz wide"><span class="${q.cls}" lang="${q.lang}" style="font-size:${size}px">${esc(q.show)}</span></div>`;
  document.getElementById('spZone').innerHTML=`<div class="opts ${q.cls==='glyph'?'grid2':''}">${q.order.map((o,i)=>`<button type="button" class="opt" data-sopt="${i}"><span class="${o.cls}">${esc(o.t)}</span></button>`).join('')}</div>`;
}
function answerSpeed(i){
  if(!SP||!SP.running||SP.lock)return;SP.lock=true;const o=SP.q.order[i];SP.total++;if(o.ok)SP.score++;
  record(null,o.ok);
  document.getElementById('spS').textContent=SP.score;
  const btns=[...document.querySelectorAll('[data-sopt]')];btns[i].dataset.state=o.ok?'ok':'ng';
  if(!o.ok)btns[SP.q.order.findIndex(x=>x.ok)].dataset.state='ok';
  SP.lockT=setTimeout(nextSpeed,o.ok?220:750);

function endSpeed(){
  if(!SP)return;stopSpeed();const mod=SP.mod;const prev=S.best[mod]||0;const isNew=SP.score>prev;if(isNew)S.best[mod]=SP.score;save();checkBadges();

  document.getElementById('stage').innerHTML=`<div class="sum"><div class="sum-score">${isNew&&SP.score>0?`<svg viewBox="0 0 200 200" aria-hidden="true"><path pathLength="1" d="M108 18C162 16 190 60 184 108 178 156 134 186 92 182 44 178 14 142 18 96 22 52 60 24 106 26M110 64c24 2 38 20 36 42-2 22-22 38-44 36-20-2-34-20-32-40 2-18 18-30 36-28 16 2 26 14 24 28"/></svg>`:''}<b class="num">${SP.score}</b><span>개</span></div>
    <p class="sum-msg">${isNew?'최고 기록이에요!':`최고 기록 ${prev}개`} · ${SP.total}문제 중 ${SP.score}개 정답</p>
    <div class="row"><button class="btn" data-sp="share">결과 복사</button><button class="btn primary" data-sp="again">다시 도전</button></div></div>`;
}
function speedEndClick(b){

  else if(b.dataset.sp==='share')copyText(SP.share,'결과를 복사했어요. 친구에게 보내 보세요.',()=>toast(SP.share));
