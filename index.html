<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하나마루 일본어</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하나마루">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDEFE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Shippori+Mincho+B1:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one-column study app — sticky header, a 田字格 practice card as the focal object, answer zone under it, fixed bottom tab bar. Red 〇 = teacher's grading mark. */
:root{
  --paper:#EDEFE9; --surface:#FAFBF7; --sunk:#E3E6DE; --ink:#19202C; --muted:#5B6371; --line:#CDD2C7;
  --ai:#2A4A7C; --ai-soft:#DCE3EE; --on-ai:#FFFFFF;
  --shu:#C9372C; --ok:#2C7A4D; --ok-soft:#DCEDE2; --ng:#B2352B; --ng-soft:#F4DDD9; --warn:#A86A12;
  --f-jp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151C;--surface:#1A202B;--sunk:#151A23;--ink:#E6E8EC;--muted:#9AA2B0;--line:#2D3543;
  --ai:#93B2E4;--ai-soft:#22304A;--on-ai:#0E1420;--shu:#EA5B4E;--ok:#6CC18F;--ok-soft:#1B3226;--ng:#EF7C70;--ng-soft:#3B2225;--warn:#E0A94A;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151C;--surface:#1A202B;--sunk:#151A23;--ink:#E6E8EC;--muted:#9AA2B0;--line:#2D3543;
  --ai:#93B2E4;--ai-soft:#22304A;--on-ai:#0E1420;--shu:#EA5B4E;--ok:#6CC18F;--ok-soft:#1B3226;--ng:#EF7C70;--ng-soft:#3B2225;--warn:#E0A94A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.jp{font-family:var(--f-jp)}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}

.shell{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:24px;height:24px;flex:none}
.top-meta{font-size:13px;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .2s}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ai);font-weight:600}
body.typing .tabs{transform:translateY(110%)}

/* generic controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;min-height:46px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--on-ai)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-size:14px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);min-height:36px}
.chip[aria-pressed="true"]{background:var(--ai-soft);border-color:var(--ai);color:var(--ink);font-weight:600}
.chip.warn[aria-pressed="true"]{background:var(--ng-soft);border-color:var(--ng)}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ai)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* setup bar */
.setup{margin-bottom:10px}
.setup-sum{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:14px;text-align:left;min-height:44px}
.setup-sum span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup-sum svg{width:16px;height:16px;flex:none;transition:transform .2s;color:var(--muted)}
.setup[data-open="true"] .setup-sum svg{transform:rotate(180deg)}
.setup-body{display:grid;gap:14px;padding:14px 4px 4px}
.setup-row{display:grid;gap:6px}
.setup-row>label,.lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.note{font-size:13px;color:var(--muted);margin:0}

/* progress */
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:2px 0 10px}
.prog-bar{flex:1;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--ai);width:0;transition:width .3s}
.score{display:flex;gap:8px}
.score .o{color:var(--shu)}

/* the practice card */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.tz{position:relative;width:150px;height:150px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:4px}
.tz::before,.tz::after{content:"";position:absolute;pointer-events:none}
.tz::before{left:50%;top:6px;bottom:6px;border-left:1px dashed var(--line)}
.tz::after{top:50%;left:6px;right:6px;border-top:1px dashed var(--line)}
.tz.wide{width:100%;height:auto;min-height:120px;border:0}
.tz.wide::before{display:none}
.glyph{font-family:var(--f-jp);font-size:108px;line-height:1;font-weight:500;position:relative;z-index:1}
.glyph.two{font-size:66px;letter-spacing:-.04em}
.roma{font-family:var(--f-mono);font-size:50px;line-height:1;position:relative;z-index:1}
.word{font-family:var(--f-jp);font-weight:500;line-height:1.15;text-align:center;position:relative;z-index:1;padding-block:8px}
.cap{margin:0;font-size:13px;color:var(--muted)}
.cat{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.qbtn{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:17px;color:var(--ai);z-index:3}
.qbtn[aria-expanded="true"]{background:var(--ai);color:var(--on-ai);border-color:var(--ai)}
.reading{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;font-size:16px;text-align:center}
.reading .jp{font-size:20px}
.reading .mono{color:var(--muted);font-size:15px}
.ko{font-size:22px;font-weight:600;line-height:1.45;text-align:center;margin:18px 4px 6px;text-wrap:balance}
.mark{position:absolute;inset:0;margin:auto;width:210px;height:210px;pointer-events:none;z-index:2;display:none}
.mark path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.card[data-mark="ok"] .mark.o,.card[data-mark="ng"] .mark.x{display:block}
.card[data-mark="ok"] .mark.o path{stroke:var(--shu);stroke-width:7;animation:draw .45s ease-out forwards}
.card[data-mark="ng"] .mark.x path{stroke:var(--ng);stroke-width:6;opacity:.75;animation:draw .3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* answer zone */
.zone{margin-top:12px}
.ans-form{display:flex;gap:8px}
.ans-form input{flex:1;min-width:0;font-size:19px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:50px}
.ans-form input.roman{font-family:var(--f-mono)}
.ans-form input.ja{font-family:var(--f-jp)}
.ans-form input:focus{border-color:var(--ai);outline:none}
.ans-form input[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.ans-form input[data-state="ng"]{border-color:var(--ng);background:var(--ng-soft)}
.sub-actions{display:flex;justify-content:flex-end;margin-top:4px}

/* keypad */
.pad{display:grid;gap:6px}
.pad-out{min-height:54px;border-bottom:2px solid var(--ink);display:flex;align-items:center;justify-content:center;gap:2px;font-family:var(--f-jp);font-size:32px;margin-bottom:4px}
.pad-out[data-state="ok"]{border-color:var(--ok);color:var(--ok)}
.pad-out[data-state="ng"]{border-color:var(--ng);color:var(--ng)}
#padTxt:empty::before{content:"아래에서 골라 입력";font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.caret{width:2px;height:30px;background:var(--ai);animation:blink 1s steps(1) infinite}
.pad-out[data-state] .caret{display:none}
@keyframes blink{50%{opacity:0}}
.pad-grid{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,42px);grid-auto-flow:column;gap:4px}
.k,.pad-fn button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--f-jp);font-size:19px;padding:0;min-width:0}
.k:active,.pad-fn button:active{background:var(--ai-soft)}
.k.blank{border:0;background:transparent}
.pad-fn{display:grid;grid-template-columns:repeat(6,1fr) 1.8fr;gap:4px}
.pad-fn button{height:46px}
.pad-fn .fn{font-family:var(--f-ui);font-size:15px;color:var(--muted);background:var(--sunk)}
.pad-fn .pad-ok{background:var(--ai);border-color:var(--ai);color:var(--on-ai);font-family:var(--f-ui);font-weight:600;font-size:15px}

/* sentence options */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:grid;gap:3px;min-height:56px;position:relative}
.opt .n{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.opt .jp{font-size:20px;line-height:1.45;padding-right:20px}
.opt .rd{font-family:var(--f-jp);font-size:14px;color:var(--muted)}
.opt .tr{font-size:14px;color:var(--muted)}
.opt[data-state="ok"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-state="ng"]{border-color:var(--ng);background:var(--ng-soft)}
.opt[data-state="dim"]{opacity:.7}

/* feedback */
.fb{margin-top:12px;display:grid;gap:10px}
.fb:empty{display:none}
.fb-box{border-radius:14px;padding:12px 14px;display:grid;gap:6px;background:var(--surface);border:1px solid var(--line)}
.fb-head{display:flex;align-items:center;gap:8px;font-weight:700}
.badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--f-jp);font-size:15px;flex:none}
.fb-box.ok .badge{border:2px solid var(--shu);color:var(--shu)}
.fb-box.ng .badge{background:var(--ng-soft);color:var(--ng)}
.fb-box.ok .fb-head{color:var(--ok)}
.fb-box.ng .fb-head{color:var(--ng)}
.fb-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.fb-line .jp{font-size:22px}
.fb-big{font-family:var(--f-jp);font-size:21px;line-height:1.5;margin:0}
.fb-sub{font-size:14px;color:var(--muted);margin:0}
.fb-actions{display:flex;gap:8px;flex-wrap:wrap}
.fb-actions .btn{flex:1}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;color:var(--ai);font-weight:600;min-height:34px}
.spk svg{width:18px;height:18px}
.given s{color:var(--ng)}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:grid;gap:14px}
.sum-score{position:relative;display:flex;align-items:baseline;justify-content:center;gap:6px;padding:20px 0}
.sum-score b{font-size:64px;line-height:1;font-weight:700}
.sum-score span{font-size:22px;color:var(--muted)}
.sum-score svg{position:absolute;inset:0;margin:auto;width:150px;height:150px}
.sum-score svg path{fill:none;stroke:var(--shu);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out .1s forwards}
.sum-msg{text-align:center;margin:0;color:var(--muted)}
.miss{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.miss li{display:flex;align-items:baseline;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.miss .jp{font-size:20px}
.miss .s{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 18px;text-align:center;display:grid;gap:12px;justify-items:center}

/* home */
.home{display:grid;gap:22px}
.h1{font-size:24px;font-weight:700;margin:6px 0 2px;letter-spacing:-.02em}
.date{color:var(--muted);font-size:14px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:24px;font-weight:700;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
.mods{display:grid;gap:10px}
.modc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.modc-head{display:flex;align-items:center;gap:12px}
.modc-ico{width:44px;height:44px;border-radius:12px;background:var(--ai-soft);display:grid;place-items:center;font-family:var(--f-jp);font-size:22px;color:var(--ai);flex:none}
.modc h3{margin:0;font-size:17px}
.modc p{margin:0;font-size:13px;color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak span{font-family:var(--f-jp);font-size:18px;min-width:38px;height:38px;padding:0 8px;display:grid;place-items:center;border-radius:8px;background:var(--ng-soft);color:var(--ng)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row div{min-width:0}
.set-row b{display:block;font-weight:500;font-size:15px}
.set-row small{display:block;color:var(--muted);font-size:12px}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.danger{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* chart */
.chart{display:grid;gap:18px}
.gojuon{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gojuon.y{grid-template-columns:repeat(3,1fr)}
.cell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px 6px;display:grid;justify-items:center;gap:0;min-height:62px}
.cell .jp{font-size:26px;line-height:1.2}
.cell .mono{font-size:11px;color:var(--muted)}
.cell.blank{visibility:hidden}
.cell::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:transparent}
.cell[data-st="weak"]::after{background:var(--ng)}
.cell[data-st="learn"]::after{background:var(--warn)}
.cell[data-st="done"]::after{background:var(--ok)}
.cell.hit{background:var(--ai-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* english */
.en{font-family:var(--f-en)}
.lang button{padding:6px 11px;font-size:13px;min-height:32px}
.modc-ico svg{width:24px;height:24px}
.eword{position:relative;z-index:1;font-family:var(--f-en);font-weight:500;line-height:1.1;text-align:center;padding:6px 10px 12px;overflow-wrap:anywhere}
.eword::after{content:"";position:absolute;left:0;right:0;bottom:4px;border-top:2px solid var(--shu);opacity:.4}
.pat{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 16px;margin:2px 0}
.pw{display:flex;gap:4px}
.pw i{width:16px;height:28px;border-bottom:2px solid var(--muted);font-style:normal;font-family:var(--f-mono);font-size:18px;line-height:26px;text-align:center;color:var(--ai)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;margin:22px 0 4px}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--ai);color:var(--on-ai);display:grid;place-items:center}
.play svg{width:34px;height:34px;margin-left:4px}
.ko.en{font-family:var(--f-en);font-weight:500}
.fb-big.en{font-family:var(--f-en);font-weight:500}
.opt .en{font-size:18px;line-height:1.4;padding-right:20px}
.opt .ko-opt{font-size:17px;font-weight:500;padding-right:20px}
.opt .tr.en{font-family:var(--f-en);font-size:15px}
.wl{display:grid;border-top:1px solid var(--line)}
.wl-i{position:relative;display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 24px 11px 4px}
.wl-i .en{font-size:19px;font-weight:600}
.wl-i .s{font-size:14px;color:var(--muted)}
.wl-i::after{content:"";position:absolute;right:8px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:transparent}
.wl-i[data-st="weak"]::after{background:var(--ng)}
.wl-i[data-st="learn"]::after{background:var(--warn)}
.wl-i[data-st="done"]::after{background:var(--ok)}
.wl-i.hit{background:var(--ai-soft)}

const R1={},R2={};
for(const x of KANA){(x.h.length===1?R1:R2)[x.h]=x.alts[0];}
Object.assign(R1,{'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゃ':'ya','ゅ':'yu','ょ':'yo','ゎ':'wa','ゔ':'vu','を':'o'});
Object.assign(R2,{'てぃ':'ti','でぃ':'di','ふぁ':'fa','ふぃ':'fi','ふぇ':'fe','ふぉ':'fo','うぃ':'wi','うぇ':'we','うぉ':'wo','しぇ':'she','じぇ':'je','ちぇ':'che','ぢゃ':'ja','ぢゅ':'ju','ぢょ':'jo'});
const PUNCT={'。':'.','、':',','？':'?','！':'!','・':' ','…':'…'};
const SPECIAL={'は':'wa','へ':'e','を':'o','では':'dewa','には':'niwa','とは':'towa','こんにちは':'konnichiwa','こんばんは':'konbanwa'};
function conv(s){
  s=toHira(s);let out='',i=0,soku=false;
  const push=r=>{if(soku){out+=r.startsWith('ch')?'t':r[0];soku=false}out+=r};
  while(i<s.length){
    const two=s.substr(i,2),one=s[i];
    if(R2[two]){push(R2[two]);i+=2;continue}
    if(one==='っ'){soku=true;i++;continue}
    if(one==='ー'){const m=out.match(/[aeiou](?=[^aeiou]*$)/);out+=m?m[0]:'';i++;continue}
    if(R1[one])push(R1[one]);else out+=PUNCT[one]??one;
    i++;
  }
  return out;
}
function romaji(str){
  return str.trim().split(/\s+/).map(tok=>{
    const m=tok.match(/^(.*?)([。、？！…]*)$/);const core=m[1],tail=m[2];
    return (SPECIAL[toHira(core)]??conv(core))+conv(tail);
  }).join(' ').replace(/\s+([.,?!])/g,'$1');
}

const pad2=n=>String(n).padStart(2,'0');

const isWeak=k=>{const s=S.stats[k];return !!s&&s.w>0&&s.s<2};
const isDone=k=>{const s=S.stats[k];return !!s&&s.s>=2&&s.c>=2};
function status(k){const s=S.stats[k];if(!s)return '';if(isWeak(k))return 'weak';if(isDone(k))return 'done';return 'learn'}
function record(k,ok){
  const prev=S.stats[k]?{...S.stats[k]}:null;
  const s=S.stats[k]||(S.stats[k]={c:0,w:0,s:0});
  if(ok){s.c++;s.s++}else{s.w++;s.s=0}
  s.t=Date.now();
  const d=S.days[today()]||(S.days[today()]={n:0,c:0});d.n++;if(ok)d.c++;
  save();updateTop();return prev;
}
function forceCorrect(k,prev){
  if(prev)S.stats[k]=prev;else delete S.stats[k];
  const s=S.stats[k]||(S.stats[k]={c:0,w:0,s:0});s.c++;s.s++;s.t=Date.now();
  const d=S.days[today()];if(d)d.c++;save();updateTop();
}
function weight(k){const s=S.stats[k];if(!s)return 1.4;let w=1+Math.max(0,s.w*2-s.c)*0.8;if(s.s===0&&s.w>0)w+=2.5;if(s.s>=3)w*=0.5;return Math.max(0.25,w)}
function pickN(pool,n){
  const arr=pool.map(p=>({p,w:weight(p.key)}));const out=[];n=Math.min(n,arr.length);
  while(out.length<n){const tot=arr.reduce((a,b)=>a+b.w,0);let r=Math.random()*tot,i=0;for(;i<arr.length-1;i++){r-=arr[i].w;if(r<=0)break}out.push(arr[i].p);arr.splice(i,1)}
  return out;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

  };
}

function buildPool(mod,ignoreOnly){
  let pool;
  if(mod==='kana'){
    const k=S.kana;const scripts=k.script==='m'?['h','k']:[k.script];
    pool=KANA.filter(x=>k.sets.includes(x.set)).flatMap(x=>scripts.map(sc=>{const ch=sc==='h'?x.h:toKata(x.h);return {...x,ch,sc,key:'k:'+ch}}));
  }else if(mod==='word')pool=WORDS.filter(w=>S.word.cats.includes(w.cat));
  else if(mod==='ew')pool=EN_WORDS.filter(w=>S.ew.cats.includes(w.cat));
  else if(mod==='es')pool=EN_SENTS.slice();
  else if(mod==='el')pool=EL_ITEMS.slice();
  else pool=SENTS.slice();
  if(S.only[mod]&&!ignoreOnly)pool=pool.filter(p=>isWeak(p.key));
  return pool;
}

function newRound(mod,items){
  clearAdv();
  const qs=items?shuffle(items):pickN(buildPool(mod),S.set.round);
  R[mod]={qs,i:0,res:[],answered:false,done:false,empty:qs.length===0};
  padVal='';
}

function renderModule(mod){
  view.onclick=null;
  view.innerHTML=`<section class="mod">${setupHTML(mod)}
    <div class="prog"><div class="prog-bar"><i id="pfill"></i></div><span id="ptext" class="num"></span><span class="score num" id="pscore"></span></div>
    <div id="stage"></div></section>`;
  bindSetup(mod);
  if(!R[mod])newRound(mod);
  showQ(mod,false);
}

function bindSetup(mod){
  const el=view.querySelector('.setup');
  el.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('setup-sum')){setupOpen[mod]=!setupOpen[mod];el.dataset.open=setupOpen[mod];b.setAttribute('aria-expanded',setupOpen[mod]);el.querySelector('.setup-body').hidden=!setupOpen[mod];return}
    if(b.dataset.set){const [g,k]=b.dataset.set.split('.');let v=b.dataset.val;if(v==='true'||v==='false')v=v==='true';S[g][k]=v}
    else if(b.dataset.multi){const [g,k]=b.dataset.multi.split('.');const v=b.dataset.val;let arr=S[g][k];
      const allN=Object.keys(mod==='ew'?EN_CATS:CATS).length;
      if((mod==='word'||mod==='ew')&&arr.length===allN)arr=[v];
      else if(arr.includes(v)){if(arr.length>1)arr=arr.filter(x=>x!==v)}else arr=[...arr,v];
      if(mod==='kana')arr=Object.keys(SETS).filter(s=>arr.includes(s));
      S[g][k]=arr}
    else if('allcats' in b.dataset){if(mod==='ew')S.ew.cats=Object.keys(EN_CATS);else S.word.cats=Object.keys(CATS)}
    else if(b.dataset.only){S.only[mod]=b.dataset.only==='1'}
    else return;
    save();R[mod]=null;renderModule(mod);
  });
}

function updateProg(mod){
  const r=R[mod];const n=r.qs.length;const c=r.res.filter(x=>x.ok).length,w=r.res.length-c;
  const pf=document.getElementById('pfill');if(!pf)return;
  pf.style.width=(n?(r.res.length/n*100):0)+'%';
  document.getElementById('ptext').textContent=n?`${Math.min(r.i+1,n)} / ${n}`:'';
  document.getElementById('pscore').innerHTML=r.res.length?`<span class="o">○ ${c}</span><span>× ${w}</span>`:'';
}

function showQ(mod,focus){
  const r=R[mod];const st=document.getElementById('stage');if(!st)return;

      :`<div class="empty"><p style="margin:0;font-weight:600">출제할 문제가 없어요</p><p class="note">위의 설정에서 범위를 골라 주세요.</p></div>`;
    st.onclick=e=>{if(e.target.closest('[data-act=allmode]')){S.only[mod]=false;save();R[mod]=null;renderModule(mod)}};

  const {card,zone,fb}=ensureStage();

  if(mod==='kana')showKana(q,card,zone,r,focus);
  else if(mod==='word')showWord(q,card,zone,r,focus);

/* ---------- kana ---------- */
let padVal='';
function acceptFor(q){const conv=q.sc==='h'?(x=>x):toKata;return KANA.filter(x=>x.prompt===q.prompt||x.alts[0]===q.prompt).map(x=>conv(x.h))}
function showKana(q,card,zone,r,focus){
  const k2r=S.kana.dir==='k2r';const scName=q.sc==='h'?'히라가나':'가타카나';
  card.innerHTML=(k2r?`<div class="tz"><span class="glyph ${q.ch.length>1?'two':''}" lang="ja">${q.ch}</span></div><p class="cap">${scName} · 발음을 알파벳으로 입력</p>`
    :`<div class="tz"><span class="roma">${q.prompt}</span></div><p class="cap">${scName}로 써 보세요</p>`)+MARKS;
  if(k2r||S.kana.input==='sys'){
    const type=k2r?'roman':'ja';
    if(zone.dataset.type!==type){
      zone.dataset.type=type;
      zone.innerHTML=`<form class="ans-form" id="ansForm" autocomplete="off"><input id="ans" type="text" class="${type}" ${k2r?'lang="en" inputmode="email" placeholder="예: ka, shi"':'lang="ja" placeholder="일본어 키보드로 입력"'} autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="답 입력"><button class="btn primary" type="submit" data-act="submit">확인</button></form>
        <div class="sub-actions"><button type="button" class="btn quiet" data-act="skip">모르겠어요</button></div>`;
      zone.querySelector('form').addEventListener('submit',e=>{e.preventDefault();formEnter('kana')});
    }
    const inp=zone.querySelector('#ans');
    if(!r.answered){inp.value='';inp.removeAttribute('data-state')}
    if(focus)inp.focus();
  }else{
    const type='pad-'+q.sc;
    if(zone.dataset.type!==type){zone.dataset.type=type;zone.innerHTML=padHTML(q.sc)}
    if(!r.answered)padVal='';
    renderPad(r.answered?(r.lastOk?'ok':'ng'):'');
  }
}
const PAD_COLS=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や_ゆ_よ','らりるれろ','わ___を'];
function padHTML(sc){
  const cv=sc==='k'?toKata:(x=>x);
  const keys=PAD_COLS.join('').split('').map(c=>c==='_'?'<span class="k blank"></span>':`<button type="button" class="k" data-k="${cv(c)}" lang="ja">${cv(c)}</button>`).join('');
  return `<div class="pad"><div class="pad-out" id="padOut"><span id="padTxt" lang="ja"></span><i class="caret"></i></div>
    <div class="pad-grid">${keys}</div>
    <div class="pad-fn"><button type="button" class="fn" data-f="daku" aria-label="탁점">゛</button><button type="button" class="fn" data-f="han" aria-label="반탁점">゜</button><button type="button" class="fn" data-f="small" aria-label="작은 글자">小</button><button type="button" data-k="${cv('ん')}" lang="ja">${cv('ん')}</button><button type="button" data-k="ー" lang="ja">ー</button><button type="button" class="fn" data-f="del" aria-label="지우기">⌫</button><button type="button" class="pad-ok" data-f="ok">확인</button></div>
    <div class="sub-actions"><button type="button" class="btn quiet" data-act="skip">모르겠어요</button></div></div>`;
}
function renderPad(state){const t=document.getElementById('padTxt');if(!t)return;t.textContent=padVal;const o=document.getElementById('padOut');if(state)o.dataset.state=state;else o.removeAttribute('data-state')}
const DK={か:'が',き:'ぎ',く:'ぐ',け:'げ',こ:'ご',さ:'ざ',し:'じ',す:'ず',せ:'ぜ',そ:'ぞ',た:'だ',ち:'ぢ',つ:'づ',て:'で',と:'ど',は:'ば',ひ:'び',ふ:'ぶ',へ:'べ',ほ:'ぼ',う:'ゔ'};
const HN={は:'ぱ',ひ:'ぴ',ふ:'ぷ',へ:'ぺ',ほ:'ぽ'};
const SM={あ:'ぁ',い:'ぃ',う:'ぅ',え:'ぇ',お:'ぉ',や:'ゃ',ゆ:'ゅ',よ:'ょ',つ:'っ',わ:'ゎ'};
const inv=o=>Object.fromEntries(Object.entries(o).map(([a,b])=>[b,a]));
const DKi=inv(DK),HNi=inv(HN),SMi=inv(SM);
function modify(f){
  if(!padVal)return;const last=padVal.slice(-1);const kata=last!==toHira(last);let h=toHira(last),n=null;
  if(f==='daku')n=DK[h]||DKi[h]||(HNi[h]?DK[HNi[h]]:null);
  else if(f==='han')n=HN[h]||HNi[h]||(DKi[h]&&HN[DKi[h]]?HN[DKi[h]]:null);
  else if(f==='small')n=SM[h]||SMi[h];
  if(n)padVal=padVal.slice(0,-1)+(kata?toKata(n):n);
}
function padKey(btn){
  const r=R.kana;
  if(r.answered){if(btn.dataset.f==='ok')next('kana');return}
  if(btn.dataset.k){if(padVal.length<4)padVal+=btn.dataset.k}
  else if(btn.dataset.f==='del')padVal=padVal.slice(0,-1);
  else if(btn.dataset.f==='ok'){if(padVal)checkKana(padVal);return}
  else modify(btn.dataset.f);
  renderPad('');
}
function checkKana(val,skip){
  const r=R.kana,q=r.qs[r.i];if(r.answered)return;
  const k2r=S.kana.dir==='k2r';let ok=false,hint='';const given=(val||'').trim();
  if(!skip){
    if(k2r){const v=given.toLowerCase().replace(/[\s']/g,'');if(!v)return;ok=q.alts.includes(v)}
    else{const v=given.replace(/\s/g,'').normalize('NFC');if(!v)return;const acc=acceptFor(q);ok=acc.includes(v);
      if(!ok){const o=q.sc==='h'?toHira(v):toKata(v);if(o!==v&&acc.includes(o))hint=q.sc==='h'?'가타카나로 썼어요. 히라가나로 써야 해요.':'히라가나로 썼어요. 가타카나로 써야 해요.'}}
  }
  const other=q.sc==='h'?toKata(q.h):q.h;
  const ans=k2r?`<span class="mono">${q.alts.join(' / ')}</span>`:`<span class="jp" lang="ja">${q.ch}</span>`;
  const extra=`<div class="fb-line"><span class="jp" lang="ja">${q.ch}</span><span class="mono">${q.alts[0]}</span><span class="fb-sub">${q.sc==='h'?'가타카나':'히라가나'} <span class="jp" lang="ja">${other}</span></span>${spkBtn(q.ch)}</div>`;
  const body=ok?`<div class="fb-head"><span class="badge">〇</span>정답</div>${extra}${!k2r&&given!==q.ch?`<p class="fb-sub">같은 소리 글자 ${given}도 정답으로 처리했어요.</p>`:''}`
    :`<div class="fb-head"><span class="badge">×</span>${skip?'정답 확인':'오답'} · 정답은 ${ans}</div>${given&&!skip?`<p class="fb-sub given">입력: <s>${esc(given)}</s></p>`:''}${hint?`<p class="fb-sub">${hint}</p>`:''}${extra}`;
  finish('kana',q,ok,given,body);
  const inp=document.getElementById('ans');if(inp)inp.dataset.state=ok?'ok':'ng';
  renderPad(ok?'ok':'ng');
  if(S.set.autoSpeak)speak(q.ch);
  if(ok&&S.set.autoNext)advT=setTimeout(()=>next('kana'),900);
}

/* ---------- word ---------- */
const kNorm=s=>s.normalize('NFC').toLowerCase().replace(/\(.*?\)/g,'').replace(/[\s.,!?~·・'"“”‘’\-…]/g,'');
const kStem=s=>s.replace(/(입니다|이에요|예요|해요|요|다)$/,'');
function meaningOk(input,ms){const a=kNorm(input);if(!a)return false;return ms.some(m=>{const b=kNorm(m);return a===b||kStem(a)===kStem(b)&&kStem(a).length>0})}
const wordSize=t=>{const n=[...t].length;return n<=2?76:n<=4?60:n<=6?46:36};
function wordReading(q){
  const disp=S.set.kanji?q.w:q.r;
  const parts=[];
  if(disp!==q.r)parts.push(`<span class="jp" lang="ja">${q.r}</span>`);
  if(!S.set.kanji&&q.w!==q.r)parts.push(`<span class="jp" lang="ja">${q.w}</span>`);
  parts.push(`<span class="mono">${romaji(q.r)}</span>`);
  return parts.join('')+spkBtn(q.r);
}
function showWord(q,card,zone,r,focus){
  const disp=S.set.kanji?q.w:q.r;const open=r.revealed||r.answered;
  card.innerHTML=`<span class="cat">${CATS[q.cat]}</span><button type="button" class="qbtn" data-act="reveal" aria-expanded="${!!open}" aria-label="읽는 법 보기">?</button>
    <div class="tz wide"><span class="word" lang="ja" style="font-size:${wordSize(disp)}px">${disp}</span></div>
    <div class="reading" id="rd" ${open?'':'hidden'}>${wordReading(q)}</div>${MARKS}`;
  if(zone.dataset.type!=='word'){
    zone.dataset.type='word';
    zone.innerHTML=`<form class="ans-form" id="ansForm" autocomplete="off"><input id="ans" type="text" lang="ko" placeholder="뜻을 한국어로" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="뜻 입력"><button class="btn primary" type="submit" data-act="submit">확인</button></form>
      <div class="sub-actions"><button type="button" class="btn quiet" data-act="skip">모르겠어요</button></div>`;
    zone.querySelector('form').addEventListener('submit',e=>{e.preventDefault();formEnter('word')});
  }
  const inp=zone.querySelector('#ans');
  if(!r.answered){inp.value='';inp.removeAttribute('data-state')}
  if(focus)inp.focus();
}
function checkWord(val,skip){
  const r=R.word,q=r.qs[r.i];if(r.answered)return;
  const given=(val||'').trim();if(!skip&&!given)return;
  const ok=!skip&&meaningOk(given,q.m);
  const info=`<div class="fb-line"><span class="jp" lang="ja">${q.w}</span>${q.w!==q.r?`<span class="jp" lang="ja" style="font-size:17px">${q.r}</span>`:''}<span class="mono">${romaji(q.r)}</span>${spkBtn(q.r)}</div>
    <p class="fb-sub">뜻: ${q.m.map(esc).join(', ')}${q.n?` · ${esc(q.n)}`:''}</p>`;
  const body=ok?`<div class="fb-head"><span class="badge">〇</span>정답</div>${info}`
    :`<div class="fb-head"><span class="badge">×</span>${skip?'정답 확인':'오답'}</div>${given&&!skip?`<p class="fb-sub given">입력: <s>${esc(given)}</s></p>`:''}${info}`;
  finish('word',q,ok,given,body,!ok&&!skip);
  document.getElementById('ans').dataset.state=ok?'ok':'ng';
  const rd=document.getElementById('rd');if(rd)rd.hidden=false;
  if(S.set.autoSpeak)speak(q.r);
  if(ok&&S.set.autoNext)advT=setTimeout(()=>next('word'),1500);
}

/* ---------- choice: sentences & listening ---------- */
const PLAY_ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg>';
function choiceItems(mod,q){
  if(mod==='sent')return [{t:q.a[0],rd:q.a[1],ko:q.k,ok:true},...q.d.map(d=>({t:d[0],rd:d[1],ko:d[2],ok:false}))];
  if(mod==='es')return [{t:q.a,ko:q.k,ok:true},...q.d.map(d=>({t:d[0],ko:d[1],ok:false}))];
  return [{t:q.k,ko:q.a,ok:true},...q.d.map(d=>({t:d[1],ko:d[0],ok:false}))];
}
function showChoice(mod,q,card,zone,r){
  const fresh=!r.order;
  if(fresh)r.order=shuffle(choiceItems(mod,q));
  const open=r.revealed||r.answered;
  if(mod==='sent')card.innerHTML=`<span class="cat">한국어 → 일본어</span>${S.set.kanji?`<button type="button" class="qbtn" data-act="reveal" aria-expanded="${!!open}" aria-label="보기 읽는 법">?</button>`:''}<p class="ko">${esc(q.k)}</p><p class="cap">알맞은 일본어를 고르세요</p>`;
  else if(mod==='es')card.innerHTML=`<span class="cat">한국어 → 영어</span><p class="ko">${esc(q.k)}</p><p class="cap">알맞은 영어 문장을 고르세요</p>`;
  else card.innerHTML=`<span class="cat">듣기</span><div class="listen"><button type="button" class="play" data-act="play" aria-label="문장 듣기">${PLAY_ICON}</button><button type="button" class="spk" data-act="playslow">${SPK_ICON}천천히 듣기</button></div>${r.answered?`<p class="ko en" lang="en">${esc(q.a)}</p>`:''}<p class="cap">들은 문장의 뜻을 고르세요</p>`;
  zone.dataset.type=mod;
  zone.innerHTML=`<div class="opts">${r.order.map((o,i)=>{
    const st=r.answered?(o.ok?'ok':(i===r.chosen?'ng':'dim')):'';
    const hid=r.answered?'':'hidden';let main,sub='',tr;
    if(mod==='sent'){main=`<span class="jp" lang="ja">${S.set.kanji?o.t:o.rd}</span>`;if(S.set.kanji)sub=`<span class="rd" lang="ja" ${open?'':'hidden'}>${o.rd}</span>`;tr=`<span class="tr" ${hid}>${esc(o.ko)}</span>`}
    else if(mod==='es'){main=`<span class="en" lang="en">${esc(o.t)}</span>`;tr=`<span class="tr" ${hid}>${esc(o.ko)}</span>`}
    else{main=`<span class="ko-opt">${esc(o.t)}</span>`;tr=`<span class="tr en" lang="en" ${hid}>${esc(o.ko)}</span>`}
    return `<button type="button" class="opt" data-opt="${i}" ${st?`data-state="${st}"`:''} ${r.answered?'aria-disabled="true"':''}><span class="n">${i+1}</span>${main}${sub}${tr}</button>`}).join('')}</div>`;
  if(mod==='el'&&fresh&&!r.answered)speak(q.a,'en');
}
function checkChoice(mod,i){
  const r=R[mod],q=r.qs[r.i];if(r.answered)return;
  const o=r.order[i];r.chosen=i;const ok=o.ok;
  let body=`<div class="fb-head"><span class="badge">${ok?'〇':'×'}</span>${ok?'정답':'오답'}</div>`;
  if(mod==='sent')body+=`<p class="fb-big" lang="ja">${q.a[0]}</p><p class="fb-sub" lang="ja" style="font-family:var(--f-jp);font-size:16px">${q.a[1]}</p><p class="fb-sub mono">${esc(romaji(q.a[1]))}</p><div>${spkBtn(q.a[0],'문장 듣기')}</div>`;
  else body+=`<p class="fb-big en" lang="en">${esc(q.a)}</p><p class="fb-sub">${esc(q.k)}</p><div>${spkBtn(q.a,'문장 듣기','en')}</div>`;
  finish(mod,q,ok,o.t,body);
  showChoice(mod,q,document.getElementById('card'),document.getElementById('zone'),r);
  if(S.set.autoSpeak){if(mod==='sent')speak(q.a[0]);else speak(q.a,'en')}
}

/* ---------- english words ---------- */
const enSize=t=>{const n=t.length;return n<=6?54:n<=10?42:n<=14?34:28};
const enNorm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
function patHTML(w,mode){return w.split(' ').map(word=>`<span class="pw">${[...word].map((c,ci)=>`<i>${mode==='full'||(mode==='hint'&&ci===0)?esc(c):''}</i>`).join('')}</span>`).join('')}
function showEW(q,card,zone,r,focus){
  const e2k=S.ew.dir==='e2k';const open=r.revealed||r.answered;const cat=`<span class="cat">${EN_CATS[q.cat]}</span>`;
  if(e2k)card.innerHTML=`${cat}<button type="button" class="qbtn" data-act="reveal" aria-expanded="${!!open}" aria-label="발음 듣기">?</button><div class="tz wide"><span class="eword" lang="en" style="font-size:${enSize(q.w)}px">${esc(q.w)}</span></div><div class="reading" id="rd" ${open?'':'hidden'}>${spkBtn(q.w,'발음 다시 듣기','en')}</div><p class="cap">뜻을 한국어로 입력 · ? 를 누르면 발음</p>${MARKS}`;
  else card.innerHTML=`${cat}<button type="button" class="qbtn" data-act="reveal" aria-expanded="${!!open}" aria-label="힌트 보기">?</button><p class="ko">${esc(q.m.join(', '))}</p><div class="pat" id="pat" aria-label="${q.w.replace(/ /g,'').length}글자">${patHTML(q.w,r.answered?'full':open?'hint':'')}</div><div class="reading" id="rd" ${open?'':'hidden'}>${spkBtn(q.w,'발음 듣기','en')}</div><p class="cap">영어로 입력 · ? 를 누르면 첫 글자와 발음</p>${MARKS}`;
  const type='ew-'+S.ew.dir;
  if(zone.dataset.type!==type){
    zone.dataset.type=type;
    zone.innerHTML=`<form class="ans-form" id="ansForm" autocomplete="off"><input id="ans" type="text" ${e2k?'lang="ko" placeholder="뜻을 한국어로"':'lang="en" inputmode="email" class="roman" placeholder="영어로 입력"'} autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="답 입력"><button class="btn primary" type="submit" data-act="submit">확인</button></form>
      <div class="sub-actions"><button type="button" class="btn quiet" data-act="skip">모르겠어요</button></div>`;
    zone.querySelector('form').addEventListener('submit',e=>{e.preventDefault();formEnter('ew')});
  }
  const inp=zone.querySelector('#ans');
  if(!r.answered){inp.value='';inp.removeAttribute('data-state')}
  if(focus)inp.focus();
}
function checkEW(val,skip){
  const r=R.ew,q=r.qs[r.i];if(r.answered)return;
  const e2k=S.ew.dir==='e2k';const given=(val||'').trim();if(!skip&&!given)return;
  const ok=!skip&&(e2k?meaningOk(given,q.m):[q.w,...q.alt].some(x=>enNorm(x)===enNorm(given)));
  const info=`<div class="fb-line"><span class="en" lang="en" style="font-size:24px;font-weight:600">${esc(q.w)}</span>${q.alt.length?`<span class="fb-sub">(${esc(q.alt.join(', '))})</span>`:''}${spkBtn(q.w,'발음 듣기','en')}</div><p class="fb-sub">뜻: ${q.m.map(esc).join(', ')}</p>`;
  const body=ok?`<div class="fb-head"><span class="badge">〇</span>정답</div>${info}`
    :`<div class="fb-head"><span class="badge">×</span>${skip?'정답 확인':'오답'}</div>${given&&!skip?`<p class="fb-sub given">입력: <s>${esc(given)}</s></p>`:''}${info}`;
  finish('ew',q,ok,given,body,!ok&&!skip);
  document.getElementById('ans').dataset.state=ok?'ok':'ng';
  const rd=document.getElementById('rd');if(rd)rd.hidden=false;
  const p=document.getElementById('pat');if(p)p.innerHTML=patHTML(q.w,'full');
  if(S.set.autoSpeak)speak(q.w,'en');
  if(ok&&S.set.autoNext)advT=setTimeout(()=>next('ew'),1500);
}
const CHECK={kana:checkKana,word:checkWord,ew:checkEW};

/* ---------- shared flow ---------- */
function finish(mod,q,ok,given,body,canOverride){
  const r=R[mod];const prev=record(q.key,ok);
  r.answered=true;r.lastOk=ok;r.mark=ok?'ok':'ng';r.res.push({q,ok,given,prev});
  const last=r.i===r.qs.length-1;
  r.fb=`<div class="fb-box ${ok?'ok':'ng'}">${body}</div><div class="fb-actions">${canOverride?`<button type="button" class="btn" data-act="override">맞은 걸로 처리</button>`:''}<button type="button" class="btn primary" data-act="next">${last?'결과 보기':'다음 문제'}</button></div>`;
  document.getElementById('card').dataset.mark=r.mark;
  document.getElementById('fb').innerHTML=r.fb;
  updateProg(mod);
}
function override(mod){
  const r=R[mod];const last=r.res[r.res.length-1];if(!last||last.ok)return;
  forceCorrect(last.q.key,last.prev);last.ok=true;r.lastOk=true;r.mark='ok';
  r.fb=r.fb.replace('fb-box ng','fb-box ok').replace(/<span class="badge">×<\/span>오답/,'<span class="badge">〇</span>정답으로 바꿨어요').replace(/<button type="button" class="btn" data-act="override">.*?<\/button>/,'');
  document.getElementById('card').dataset.mark='ok';document.getElementById('fb').innerHTML=r.fb;
  const inp=document.getElementById('ans');if(inp)inp.dataset.state='ok';
  updateProg(mod);
}
function next(mod){
  clearAdv();const r=R[mod];if(!r||!r.answered)return;
  r.i++;r.answered=false;r.fb='';r.mark='';r.revealed=false;r.chosen=null;r.order=null;
  if(r.i>=r.qs.length)r.done=true;
  if(curTab()===mod)showQ(mod,true);
}
function formEnter(mod){
  const r=R[mod];const inp=document.getElementById('ans');
  if(r.answered){next(mod);return}
  CHECK[mod](inp.value);
}
function stageClick(mod,e){
  const b=e.target.closest('button');if(!b||b.dataset.speak)return;
  const act=b.dataset.act;const r=R[mod];const q=r&&!r.done&&r.qs[r.i];
  if(act==='next')next(mod);
  else if(act==='skip'){if(r.answered)next(mod);else CHECK[mod]('',true)}
  else if(act==='override')override(mod);
  else if(act==='reveal'){r.revealed=!r.revealed||r.answered;b.setAttribute('aria-expanded',r.revealed);
    if(mod==='word'){document.getElementById('rd').hidden=!r.revealed}
    else if(mod==='ew'){document.getElementById('rd').hidden=!r.revealed;const p=document.getElementById('pat');if(p&&!r.answered)p.innerHTML=patHTML(q.w,r.revealed?'hint':'');if(r.revealed&&S.ew.dir==='e2k')speak(q.w,'en')}
    else document.querySelectorAll('.opt .rd').forEach(x=>x.hidden=!r.revealed)}
  else if(act==='play'||act==='playslow'){if(q)speak(q.a,'en',act==='playslow')}
  else if(act==='retry'){newRound(mod,uniqueMissed(mod));showQ(mod,false)}
  else if(act==='again'){newRound(mod);showQ(mod,false)}
  else if(b.dataset.opt!==undefined){if(r.answered)return;checkChoice(mod,+b.dataset.opt)}
  else if(b.classList.contains('k')||b.closest('.pad-fn'))padKey(b);
}
function uniqueMissed(mod){const seen=new Set();return R[mod].res.filter(x=>!x.ok).map(x=>x.q).filter(q=>!seen.has(q.key)&&seen.add(q.key))}
function summary(mod){
  const r=R[mod];const st=document.getElementById('stage');
  const n=r.res.length,c=r.res.filter(x=>x.ok).length,pct=n?Math.round(c/n*100):0;
  const missed=r.res.filter(x=>!x.ok);
  const msg=pct===100?'전부 맞혔어요. 하나마루!':pct>=80?'잘했어요. 틀린 것만 한 번 더 보면 확실해져요.':pct>=50?'절반 넘게 맞혔어요. 틀린 문제를 다시 풀어 보세요.':'처음엔 다 어려워요. 틀린 것부터 천천히 다시 해 봐요.';
  const item=x=>{const q=x.q;
    if(mod==='kana')return `<li><span class="jp" lang="ja">${q.ch}</span><span class="mono">${q.alts[0]}</span>${x.given?`<span class="s given">입력 <s>${esc(x.given)}</s></span>`:''}</li>`;
    if(mod==='word')return `<li><span class="jp" lang="ja">${q.w}</span><span class="s" lang="ja">${q.w!==q.r?q.r+' · ':''}${esc(q.m[0])}</span></li>`;
    if(mod==='ew')return `<li><span class="en" lang="en" style="font-size:19px;font-weight:600">${esc(q.w)}</span><span class="s">${esc(q.m.join(', '))}</span></li>`;
    if(mod==='es'||mod==='el')return `<li style="display:grid;gap:2px"><span>${esc(q.k)}</span><span class="en" lang="en" style="font-size:17px">${esc(q.a)}</span></li>`;
    return `<li style="display:grid;gap:2px"><span>${esc(q.k)}</span><span class="jp" lang="ja" style="font-size:17px">${q.a[0]}</span></li>`};
  st.innerHTML=`<div class="sum">
    <div class="sum-score">${pct>=80?`<svg viewBox="0 0 200 200" aria-hidden="true"><path pathLength="1" d="M108 18C162 16 190 60 184 108 178 156 134 186 92 182 44 178 14 142 18 96 22 52 60 24 106 26M110 64c24 2 38 20 36 42-2 22-22 38-44 36-20-2-34-20-32-40 2-18 18-30 36-28 16 2 26 14 24 28"/></svg>`:''}<b class="num">${c}</b><span class="num">/ ${n}</span></div>
    <p class="sum-msg">${msg}</p>
    ${missed.length?`<div><p class="lbl" style="margin:0 0 6px">틀린 문제</p><ul class="miss">${missed.map(item).join('')}</ul></div>`:''}
    <div class="row">${missed.length?`<button class="btn primary" data-act="retry">틀린 ${uniqueMissed(mod).length}개 다시</button>`:''}<button class="btn ${missed.length?'':'primary'}" data-act="again">새 라운드</button></div>
  </div>`;
  st.onclick=e=>stageClick(mod,e);
  updateProg(mod);
  document.getElementById('ptext').textContent='완료';
}

/* keyboard (desktop) */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tab=curTab();const r=R[tab];if(!r||r.done||r.empty)return;
  if(e.target.matches('input'))return;
  if(['sent','es','el'].includes(tab)){if(!r.answered&&/^[1-3]$/.test(e.key)){checkChoice(tab,+e.key-1);e.preventDefault()}else if(r.answered&&e.key==='Enter'){next(tab);e.preventDefault()}return}
  if(tab==='kana'&&S.kana.dir==='r2k'&&S.kana.input==='pad'){
    if(e.key==='Enter'){if(r.answered)next('kana');else if(padVal)checkKana(padVal);e.preventDefault()}
    else if(e.key==='Backspace'&&!r.answered){padVal=padVal.slice(0,-1);renderPad('');e.preventDefault()}
    return;
  }
  if(r.answered&&e.key==='Enter'){next(tab);e.preventDefault()}
});

/* ================= chart ================= */
let chartSc='h';
function renderChart(){
  const cv=chartSc==='k'?toKata:(x=>x);
  const by=h=>KANA.find(x=>x.h===h);
  const cell=h=>{if(!h)return '<span class="cell blank"></span>';const x=by(h);const ch=cv(h);return `<button class="cell" data-ch="${ch}" data-st="${status('k:'+ch)}"><span class="jp" lang="ja">${ch}</span><span class="mono">${x.alts[0]}</span></button>`};
  const rows=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や_ゆ_よ','らりるれろ','わ___を','ん____'];
  const drows=['がぎぐげご','ざじずぜぞ','だぢづでど','ばびぶべぼ','ぱぴぷぺぽ'];
  const grid=rs=>rs.map(r=>r.split('').map(c=>cell(c==='_'?null:c)).join('')).join('');
  const yoon=KANA.filter(x=>x.set==='yoon').map(x=>cell(x.h)).join('');
  view.innerHTML=`<div class="chart">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      ${`<div class="seg" role="group">${[['h','ひらがな'],['k','カタカナ']].map(([v,l])=>`<button data-sc="${v}" aria-pressed="${chartSc===v}">${l}</button>`).join('')}</div>`}
      <div class="legend"><span><i style="background:var(--ok)"></i>익힘</span><span><i style="background:var(--warn)"></i>연습 중</span><span><i style="background:var(--ng)"></i>복습 필요</span></div>
    </div>
    <p class="note">${hasTTS?'글자를 누르면 발음을 들을 수 있어요.':'글자별 학습 상태를 색 점으로 보여 줘요.'}</p>
    <section><h2 class="sec-title">청음 · 기본</h2><div class="gojuon">${grid(rows)}</div></section>
    <section><h2 class="sec-title">탁음 · 반탁음</h2><div class="gojuon">${grid(drows)}</div></section>
    <section><h2 class="sec-title">요음</h2><div class="gojuon y">${yoon}</div></section>
  </div>`;
  view.onclick=e=>{
    const s=e.target.closest('[data-sc]');if(s){chartSc=s.dataset.sc;renderChart();return}
    const c=e.target.closest('.cell[data-ch]');if(c){speak(c.dataset.ch);view.querySelectorAll('.cell.hit').forEach(x=>x.classList.remove('hit'));c.classList.add('hit')}
  };
}

/* ================= english word list ================= */
function renderList(){
  view.innerHTML=`<div class="chart">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <p class="note">${hasTTS?'단어를 누르면 발음을 들을 수 있어요.':'단어별 학습 상태를 색 점으로 보여 줘요.'}</p>
      <div class="legend"><span><i style="background:var(--ok)"></i>익힘</span><span><i style="background:var(--warn)"></i>연습 중</span><span><i style="background:var(--ng)"></i>복습 필요</span></div>
    </div>
    ${Object.entries(EN_CATS).map(([c,l])=>`<section><h2 class="sec-title">${l}</h2><div class="wl">${EN_WORDS.filter(w=>w.cat===c).map(w=>`<button class="wl-i" data-w="${esc(w.w)}" data-st="${status(w.key)}"><span class="en" lang="en">${esc(w.w)}</span><span class="s">${esc(w.m.join(', '))}</span></button>`).join('')}</div></section>`).join('')}
  </div>`;
  view.onclick=e=>{const c=e.target.closest('.wl-i');if(c){speak(c.dataset.w,'en');view.querySelectorAll('.wl-i.hit').forEach(x=>x.classList.remove('hit'));c.classList.add('hit')}};
}

renderTabs();
go(curTab());
})();
</script>
